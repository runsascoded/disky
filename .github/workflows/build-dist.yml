name: Build @rdub/treemap dist branch

# Builds a SHA-pinnable `dist/treemap` branch for `packages/treemap/` (the
# `@rdub/treemap` core) so external consumers (file-tree, marin's site, etc.)
# can `pnpm add github:runsascoded/disk-tree#<dist-sha>` without pulling the
# whole monorepo. Uses runsascoded/npm-dist in `package_dir` mode, which packs
# the one package and flattens it to the dist branch ROOT — so the git dep
# resolves to `@rdub/treemap` directly: the compiled npm build (`tsup` → `dist/`;
# `pnpm pack` respects its `files` and `publishConfig`).
#
# Branch-name convention: multi-target repos namespace their dist branches
# under `dist/<pkg>` (here `dist/treemap`). Slashed dist branches are fine
# downstream — `git fetch/checkout/orphan` accept them, and consumers pin the
# resolved SHA (`github:…#<sha>`), never the branch name. Git's one rule: a
# `dist/<x>` ref can't coexist with a bare `dist` branch (dir-vs-file). This
# repo's legacy `dist` branch (the pre-split `@disk-tree/react` build) is
# renamed to `dist/react` for that reason; its old SHA pins keep resolving.
#
# `@rdub/treemap` has no workspace dependencies (only peers), so its packed
# artifact is self-contained. `@disk-tree/react` (packages/react) is NOT
# dist-built: it depends on `@rdub/treemap` via `workspace:*`, which can't
# resolve outside the monorepo; nothing external consumes its disk widgets. If
# that changes, add a job packing it to `dist/react` that rewrites the
# workspace dep to a `dist/treemap` SHA via npm-dist's `pkg_kvs`.
#
# Fires on any push to main that touches packages/treemap/, and on manual
# dispatch for one-off rebuilds.

on:
  push:
    branches: [main, cloud]
    paths:
      - "packages/treemap/**"
      - ".github/workflows/build-dist.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source ref to build from (default: main)"
        type: string
        default: ""

jobs:
  build-dist:
    permissions:
      contents: write
    uses: runsascoded/npm-dist/.github/workflows/build-dist.yml@v1
    with:
      # Package at the dist branch ROOT → `github:runsascoded/disk-tree#<dist-sha>`
      # resolves to `@rdub/treemap`. (`pnpm pack` carries `dist/` + README per the
      # package's `files`, and applies its `publishConfig` entry points: the npm build.)
      package_dir: packages/treemap
      dist_branch: dist/treemap
      source_ref: ${{ inputs.source_ref }}
      # The package's `build` is `tsup` (compiled ESM + types into `dist/`, the npm
      # package's contents); the workspace itself still imports `src/`. Only this
      # package: the root `build` is `pnpm -r build`, which also dry-run-deploys
      # the workspace's Workers (wrangler needs Node ≥ 22).
      build_command: pnpm -C packages/treemap run build
      node_version: '22'
