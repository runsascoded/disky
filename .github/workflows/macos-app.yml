name: macOS app

on:
  push:
    branches: [tauri-native-app]
    tags: ['disky-v*']
    paths:
      - 'apps/tauri/**'
      - 'site/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/macos-app.yml'
  pull_request:
    paths: ['apps/tauri/**', 'site/**', 'packages/**', '.github/workflows/macos-app.yml']

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/') || github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/tauri -> target'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: App checks (prepare resources, Rust and site)
        run: apps/tauri/scripts/check
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Package Apple Silicon pilot
        run: apps/tauri/scripts/package
      - name: Smoke the extracted downloadable ZIP
        run: |
          mkdir -p tmp/extracted
          ditto -x -k tmp/releases/*/*.app.zip tmp/extracted
          node apps/tauri/scripts/smoke.mjs tmp/extracted/disky.app
      - uses: actions/upload-artifact@v4
        with:
          name: disky-apple-silicon
          path: tmp/releases/*/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/disky-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Require verified app-branch builds for this tag's commit
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          for workflow in ci.yml macos-app.yml; do
            run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --branch tauri-native-app --event push --commit "$commit" \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$run_id" ]; then
              echo "Push this commit to tauri-native-app and wait for $workflow to pass before tagging." >&2
              exit 1
            fi
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: disky-apple-silicon
          path: tmp/release
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish pilot prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("apps/tauri/src-tauri/tauri.conf.json")).version')
          test "$RELEASE_TAG" = "disky-v$version"
          assets="tmp/release/disky-$version-arm64"
          (cd "$assets" && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" "$assets"/* --verify-tag --prerelease \
            --latest=false \
            --title "disky ${RELEASE_TAG#disky-v} — Apple Silicon pilot" \
            --notes-file apps/tauri/PILOT.md
