name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create empty ui/dist for editable install
        run: mkdir -p ui/dist

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Create empty ui/dist for editable install
        run: mkdir -p ui/dist

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run mypy
        run: uv run mypy src/disk_tree --ignore-missing-imports
        continue-on-error: true  # Don't fail build on type errors for now

  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd ui && pnpm tsc --noEmit

      - name: Build
        run: cd ui && pnpm build

  treemap-widget:
    name: "@rdub/treemap (typecheck + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd packages/treemap && pnpm typecheck

      - name: Test
        run: cd packages/treemap && pnpm test

  react-widgets:
    name: "@disk-tree/react (typecheck + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd packages/react && pnpm typecheck

      - name: Test
        run: cd packages/react && pnpm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Python setup for server
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      # Node.js setup for UI build and Playwright
      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: cd ui && pnpm build

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Install Playwright browsers
        run: cd ui && pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: cd ui && pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
