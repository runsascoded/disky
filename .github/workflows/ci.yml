name: CI

# Every long-lived branch (cloud, local and the deployments that merge them);
# `dist/**` branches are build outputs.
on:
  push:
    branches-ignore: ['dist/**']
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest tests/ -v

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run mypy
        run: uv run mypy src/disk_tree --ignore-missing-imports
        continue-on-error: true  # Don't fail build on type errors for now

  treemap-widget:
    name: "@rdub/treemap (typecheck + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd packages/treemap && pnpm typecheck

      - name: Test
        run: cd packages/treemap && pnpm test

  react-widgets:
    name: "@disk-tree/react (typecheck + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd packages/react && pnpm typecheck

      - name: Test
        run: cd packages/react && pnpm test

  dt-cloud-test:
    name: dt-cloud tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # One workspace env from the root lockfile (`cloud/` is a member), at the
      # pins the job images install `--frozen`.
      - name: Sync dt-cloud
        run: uv sync --frozen --all-packages --all-extras --all-groups

      - name: Run dt-cloud tests
        run: cd cloud && uv run --no-sync pytest tests -v

  site:
    name: Site typecheck, build + tests
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field.

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # the D1 test fake uses `node:sqlite` (Node ≥ 22.5)
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` = `tsc -b && vite build`: typechecks the SPA and the
      # Functions, then bundles.
      - name: Build site (typecheck + bundle)
        run: cd site && pnpm build

      - name: Site tests
        run: cd site && timeout 900 pnpm vitest run --testTimeout=20000
