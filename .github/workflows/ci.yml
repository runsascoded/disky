name: CI

# Every long-lived branch (cloud, local and the deployments that merge them);
# `dist/**` branches are build outputs, and a deployment's `<deploy>-prod` /
# `<deploy>-dev` pointers are pushed at a sha its own branch already tested
# (`dev`, the demo's dev branch, stays: `deploy-r2.yml` deploys on its CI).
on:
  push:
    branches-ignore: ['dist/**', '*-prod', '*-dev']
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # The suites are deterministic (seeded fixtures): a tree whose inputs
      # already passed on this Python is not re-run. `engine` keys on the
      # blob ids of the engine's sources, tests and pins.
      - name: Test inputs key
        id: key
        run: echo "key=engine-${{ matrix.python-version }}-$(git ls-tree -r HEAD -- src tests pyproject.toml uv.lock | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Already passed?
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: .tests-passed
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Install uv
        if: steps.passed.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.passed.outputs.cache-hit != 'true'
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        if: steps.passed.outputs.cache-hit != 'true'
        run: uv sync --frozen --all-extras

      - name: Run tests
        if: steps.passed.outputs.cache-hit != 'true'
        run: uv run pytest tests/ -v

      - name: Record pass
        if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p .tests-passed && echo "${{ github.sha }}" > .tests-passed/sha

      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tests-passed
          key: ${{ steps.key.outputs.key }}

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run mypy
        run: uv run mypy src/disk_tree --ignore-missing-imports

  treemap-widget:
    name: "@open-athena/treemap (typecheck + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd packages/treemap && pnpm typecheck

      - name: Test
        run: cd packages/treemap && pnpm test

  react-widgets:
    name: "@disk-tree/react (typecheck + test)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field;
        # passing `version:` here on top of that is a hard error in v4.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: cd packages/react && pnpm typecheck

      - name: Test
        run: cd packages/react && pnpm test

  dt-cloud-test:
    name: dt-cloud tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # Full history: a pending D1 recipe (`site/migrations/*.sql`) is checked
      # against `site/schema.sql` as it was before the recipe landed
      # (`test_d1_schema.py`, `dt_cloud.d1_schema.pre_image`).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The suites are deterministic (seeded fixtures): a tree whose inputs
      # already passed on this Python is not re-run. `dt-cloud` keys on the
      # tracked files' blob ids, minus docs (they read `site/`'s schema
      # and Functions too, so the whole tree counts).
      - name: Test inputs key
        id: key
        run: echo "key=dt-cloud-${{ matrix.python-version }}-$(git ls-tree -r HEAD | grep -vE '[[:space:]](specs/|.*\.md$)' | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"

      - name: Already passed?
        id: passed
        uses: actions/cache/restore@v4
        with:
          path: .tests-passed
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Install uv
        if: steps.passed.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.passed.outputs.cache-hit != 'true'
        run: uv python install ${{ matrix.python-version }}

      # One workspace env from the root lockfile (`cloud/` is a member), at the
      # pins the job images install `--frozen`.
      - name: Sync dt-cloud
        if: steps.passed.outputs.cache-hit != 'true'
        run: uv sync --frozen --all-packages --all-extras --all-groups

      - name: Run dt-cloud tests
        if: steps.passed.outputs.cache-hit != 'true'
        run: cd cloud && uv run --no-sync pytest tests -v

      - name: Record pass
        if: steps.passed.outputs.cache-hit != 'true'
        run: mkdir -p .tests-passed && echo "${{ github.sha }}" > .tests-passed/sha

      - if: steps.passed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .tests-passed
          key: ${{ steps.key.outputs.key }}

  site:
    name: Site typecheck, build + tests
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # pnpm version comes from root package.json's `packageManager` field.

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # the D1 test fake uses `node:sqlite` (Node ≥ 22.5)
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm build` = `tsc -b && vite build`: typechecks the SPA and the
      # Functions, then bundles.
      - name: Build site (typecheck + bundle)
        run: cd site && pnpm build

      - name: Site tests
        run: cd site && timeout 900 pnpm vitest run --testTimeout=20000
