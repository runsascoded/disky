# The cloud reduce runner (spec `specs/done/cloud-reduce.md`, step 3): turn a
# `disk-tree capture` that a laptop streamed to R2 into a scan blob, on a
# machine that has disk. The same plain `disk-tree reduce` invocation runs on
# a VM or Batch later; GHA is just the zero-infra host.
#
# Needs, in this repo's settings:
#   secrets  R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   (an R2 API token)
#   variable R2_ENDPOINT_URL                          (https://<acct>.r2.cloudflarestorage.com)
#
# Afterwards, on the laptop:
#   disk-tree scans register <to>      # imports the `<blob>.scan.json` the reduce left beside the blob
name: Reduce

on:
  workflow_dispatch:
    inputs:
      capture:
        description: 'Capture dir URL (the one `disk-tree capture` printed), e.g. r2://disk-tree/captures/<host>/<root>/<stamp>'
        required: true
      to:
        description: 'Where the scan blob (+ its .scan.json manifest) goes'
        required: true
        default: 'r2://disk-tree/scans'
      engine:
        description: 'Aggregation engine'
        type: choice
        options: [duckdb, stream, pandas]
        default: duckdb
      memory_limit:
        description: 'DuckDB memory cap (the runner has ~7 GB; excess spills to disk)'
        default: '5GB'

jobs:
  reduce:
    name: Reduce
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      DISK_TREE_R2_ENDPOINT_URL: ${{ vars.R2_ENDPOINT_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Create empty ui/dist for editable install
        run: mkdir -p ui/dist

      - name: Install disk-tree (+ R2 driver)
        run: uv sync --frozen --extra r2

      - name: Reduce
        run: >
          uv run disk-tree reduce -D
          -e "${{ inputs.engine }}"
          -M "${{ inputs.memory_limit }}"
          -t "${{ inputs.to }}"
          "${{ inputs.capture }}"
