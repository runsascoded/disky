name: Healthcheck

# Live-site serving health for the four OA sites, independent of the test suite: hits
# the running site (latest scan) and fails if it isn't servable — the class of
# outage a green data pipeline can still cause (2026-08-31: a scan whose D1
# index footer never synced → the owner rollup 1102'd → /users blank).
#
# Needs a read-only grant token per host in the repo secrets (`GCS_USAGE_TOKEN`,
# `CW_S3_USAGE_TOKEN`, `HF_USAGE_TOKEN`, `R2_USAGE_TOKEN`); a matrix entry skips
# (exit 0) when its secret is absent. Each entry checks out its own deploy
# branch, rather than the front door's own copy of the shared code.
on:
  schedule:
    - cron: "17 * * * *" # hourly, offset off the top of the hour
  workflow_dispatch:

jobs:
  healthcheck:
    # Every OA deployment, from the default branch (GitHub runs `schedule:`
    # workflows only from there). Each entry probes its live host with its own
    # read-only grant token, using its own branch's `dt-cloud`; a store that
    # publishes under a subdir sets it (`SNAPSHOTS_SUBDIR` → `dt-cloud healthcheck -s`).
    name: ${{ matrix.host }} serving health
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: gcs.oa.dev
            branch: gcs
            secret: GCS_USAGE_TOKEN
            subdir: ""
          - host: cw.oa.dev
            branch: cw
            secret: CW_S3_USAGE_TOKEN
            subdir: cw
          - host: hf.oa.dev
            branch: hf
            secret: HF_USAGE_TOKEN
            subdir: hf
          - host: r2.oa.dev
            branch: r2
            secret: R2_USAGE_TOKEN
            subdir: r2
    env:
      GCS_USAGE_TOKEN: ${{ secrets[matrix.secret] }}
      GCS_USAGE_URL: https://${{ matrix.host }}
      SNAPSHOTS_SUBDIR: ${{ matrix.subdir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dt-cloud
        run: uv sync --frozen --all-packages

      - name: Run healthcheck
        run: |
          if [ -z "${GCS_USAGE_TOKEN:-}" ]; then
            echo "${{ matrix.secret }} secret not set — skipping live healthcheck"
            exit 0
          fi
          cd cloud && uv run --no-sync dt-cloud healthcheck

      # The site's page loads, uncached (`-c`), as the browser sends them:
      # fails on any 5xx or dropped request (2026-10-01: a filtered view 1102'd
      # its whole batch while the healthcheck passed).
      - name: Page-load probe
        run: |
          if [ -z "${GCS_USAGE_TOKEN:-}" ]; then
            echo "${{ matrix.secret }} secret not set — skipping page-load probe"
            exit 0
          fi
          cd cloud && uv run --no-sync dt-cloud probe -c
