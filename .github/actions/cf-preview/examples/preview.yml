# Copy into a caller only after policy/config review and pin ACTION_SHA below.
# This example targets main. Disky's default-branch controller needs its own four-target routing wrapper.
# Mode: `/preview <mode>` (this run), else a `preview:<mode>` label, else `ui` (the PR's front end over
# read-only production data). Only `ui` is implemented; `stack` and `pipeline` are refused at the gate.
name: PR preview
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
      mode:
        description: ui | stack | pipeline; empty = the PR's preview:<mode> label, else ui
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cf-preview-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false
jobs:
  gate:
    if: >-
      github.event.action != 'closed' &&
      (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || startsWith(github.event.label.name, 'preview:')) &&
      (github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/preview')))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      base_sha: ${{ steps.gate.outputs.base_sha }}
      mode: ${{ steps.gate.outputs.mode }}
      url: ${{ steps.gate.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - id: gate
        uses: Open-Athena/disky/.github/actions/cf-preview@ACTION_SHA
        with:
          operation: gate
          config: .github/cf-preview.json
          github-token: ${{ github.token }}
  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # `ui` publishes only the static build (the PR's Functions are never deployed in that mode).
      - name: Caller-specific frozen build and tests
        env:
          PREVIEW_URL: ${{ needs.gate.outputs.url }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ needs.gate.outputs.sha }}
          path: dist
          include-hidden-files: true
  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.base_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install trusted deployment tools
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: preview-${{ needs.gate.outputs.sha }}
          path: ${{ runner.temp }}/preview-artifact
      - id: preview
        uses: Open-Athena/disky/.github/actions/cf-preview@ACTION_SHA
        with:
          operation: publish
          config: .github/cf-preview.json
          sha: ${{ needs.gate.outputs.sha }}
          mode: ${{ needs.gate.outputs.mode }}
          artifact: ${{ runner.temp }}/preview-artifact
          github-token: ${{ github.token }}
          deploy-token: ${{ secrets.CF_PREVIEW_DEPLOY_TOKEN }}
          dns-token: ${{ secrets.CF_PREVIEW_DNS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-receipt-${{ github.run_id }}
          path: ${{ steps.preview.outputs.receipt }}
          retention-days: 90
  retire:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - id: retire
        uses: Open-Athena/disky/.github/actions/cf-preview@ACTION_SHA
        with:
          operation: retire
          config: .github/cf-preview.json
          github-token: ${{ github.token }}
          deploy-token: ${{ secrets.CF_PREVIEW_DEPLOY_TOKEN }}
          dns-token: ${{ secrets.CF_PREVIEW_DNS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retire-receipt-${{ github.run_id }}
          path: ${{ steps.retire.outputs.receipt }}
          retention-days: 90
