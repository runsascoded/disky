# Job image build with layer caching: `--cache-from` the last :latest (built
# with an inline cache) so unchanged layers — node deps, the site
# build, wrangler, the disk-tree install — are reused, and a gcs-usage-only
# change rebuilds just its own layers. First build after enabling is cold.
#
# `_GIT_SHA` / `_GIT_DIRTY` (from `job/build.sh`) stamp the image with its source
# revision (Dockerfile `ARG`s → labels + env); a build without them is refused.
substitutions:
  _GIT_SHA: ""
  _GIT_DIRTY: ""
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        case "$_GIT_SHA" in
          [0-9a-f]*) ;;
          *) echo "refusing an unstamped build: run job/build.sh (it passes _GIT_SHA/_GIT_DIRTY)" >&2; exit 1 ;;
        esac
        case "$_GIT_DIRTY" in
          0|1) ;;
          *) echo "_GIT_DIRTY must be 0 or 1, got '$_GIT_DIRTY'" >&2; exit 1 ;;
        esac
        docker pull "$_IMAGE" || true
        DOCKER_BUILDKIT=1 docker build \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg "DISKY_GIT_SHA=$_GIT_SHA" \
          --build-arg "DISKY_GIT_DIRTY=$_GIT_DIRTY" \
          --cache-from "$_IMAGE" \
          -t "$_IMAGE" .
images: ["$_IMAGE"]
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
