[package]
name = "disk-tree-app"
version = "0.1.1"
edition = "2021"
description = "disk-tree — native macOS app (Tauri v2 host)"
license = "MIT"

[lib]
# Tauri v2 convention: the app lives in a lib so mobile/desktop entrypoints share it.
name = "disk_tree_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
plist = "1"
dt-capture = { path = "../crates/dt-capture" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSAppleEventManager", "NSAppleEventDescriptor", "objc2-core-services"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
