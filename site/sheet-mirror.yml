# gcs's sheet mirror (deploy/sheet-mirror/deploy.sh -P site/sheet-mirror.yml; infra/gcp owns its trigger + IAM).
# Replaces the retired sheet-sync/ (hourly mark-status → Percy's sheet).
site: https://gcs.oa.dev
token_secret: gcs-sheet-sync-token
schedule: "5 * * * *"

gcp:
  project: oa-internal-450019
  service_account: gcs-usage-job@oa-internal-450019.iam.gserviceaccount.com
  region: us-central1
  job: gcs-sheet-sync
  trigger: gcs-sheet-sync-hourly

mirrors:
  - sheet: ${GCS_SHEET_ID}   # untracked .envrc; substituted at deploy time
    tab: Storage by user
    source: owners
    key: user
    unit: TiB
    footer: "⟳ Auto-synced hourly from {site}/users — edits are overwritten; add derived views in another tab"
