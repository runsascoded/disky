# CF Pages project config (oa-gcs-usage → gcs.oa.dev). `wrangler pages deploy`
# reads this, so bindings + vars declared here apply to the deployment it
# creates. This is the gcs deployment's copy of the base's file: same shape,
# this store's values (the cw-s3 twin is on the cw-s3-next branch).
name = "oa-gcs-usage"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"
compatibility_flags = ["enable_request_signal", "nodejs_als"]   # `request.signal` aborts when the viewer cancels, so the interval store evicts that request's in-flight reads at once (`_lib/index.ts`); `nodejs_als`: the request's async context, which charges each R2/D1/KV call to its usage point (`_lib/usage.ts`)

# D1: the @open-athena/auth tables (grants, access_log, access_requests,
# profiles, pending_auth) plus the app's own (allowlist, the owner ledger
# (`actions`/`owner_prefixes`/`claims`, `owner_totals`), index metadata, plans, sweeps). Its current
# schema is `schema.sql` (gcs's own; specs/done/d1-migrations.md); a change is a recipe in
# `migrations/<slug>.sql`, applied with `wrangler d1 execute oa-gcs-usage-auth --remote --file
# migrations/<slug>.sql` (needs CLOUDFLARE_ACCOUNT_ID=74981a43… + the D1-scoped token), then removed.
# `dt-cloud d1-schema check -d oa-gcs-usage-auth` compares the live schema with `schema.sql`.
[[d1_databases]]
binding = "DB"
database_name = "oa-gcs-usage-auth"
database_id = "e52398b7-5538-4bc4-83db-3355a1b5ef9a"
# `wrangler pages dev` binds the REAL prod D1 (RW). `site/dev --local-db` runs
# against a copy of this file with the line stripped, for a local miniflare D1.
remote = true

# Global second cache tier for the per-scan-immutable JSON endpoints
# (`/api/subtree`, `/api/diff`): the Workers Cache API is per data-center, so
# the daily job's warm-up (`dt-cloud warm-cache`) only reaches everyone
# through KV. Created with `wrangler kv namespace create oa-gcs-usage-cache`.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "757702a080a549418f16a5ae096529c4"

# Worker-served indexes (static name search; `infra/cf` `r2Bucket`).
[[r2_buckets]]
binding = "INDEX_R2"
bucket_name = "oa-gcs-usage-index"

# Usage attribution (`_lib/usage.ts`, specs/usage-metrics.md): one point per Functions request.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "disky_usage_gcs"

[observability]
enabled = true

[vars]
SESSION_MONITOR = "1"           # monitor-only cron; fixed absolute expiry 2026-10-21 UTC
SERVED_R2 = "1"   # snapshot JSONs (meta/age/lifecycle/rules) + extras read from INDEX_R2, not GCS (the job copies them: `publish-r2 -S`)
STORE = "gcs"                   # the store this build serves (`src/stores.ts` registry key; vite.config.ts)
PROD_HOST = "gcs.oa.dev"        # `g d` toggles with DEV_HOST (src/hosts.ts)
DEV_HOST = "dev.gcs.oa.dev"
AUTH_MODE = "app"               # the client's whoami source: the app session, no edge gate (vite.config.ts)
ROOT_LABEL = "Marin GCS"        # the store root's crumb label (`_lib/view.ts`)
MARK = "gcs"                    # favicon + apple-touch icon: `public/icons/gcs*` (vite.config.ts injects the links)
OG_CARDS = "1"                  # dynamic share cards for every page (specs/done/dogi.md)
BASE_SCOPE = "gcs"              # the viewer scope this deployment grants (`_lib/auth.ts`)
JOB_SA = "gcs-usage-job@oa-internal-450019.iam.gserviceaccount.com"  # the account sweep-dispatched Batch jobs run as (`_lib/planDispatch.ts`)
# Deployment resources (specs/oa-decoupling.md): `cloud` carries no defaults for these.
STORE_BUCKET = "oa-gcs-usage-dvx"     # the path store's bucket (`_lib/index.ts`)
PATH_STORE = "intervals"   # every request reads the interval store (INDEX_R2) for the scans its generation holds; others (and any sort it lacks) read per-scan from STORE_BUCKET. The generation is `interval-store/CURRENT.json` on INDEX_R2 (a compaction moves it); `INTERVAL_STORE_GEN` would pin one; the static name index likewise follows `static-names/CURRENT.json` (`STATIC_GEN` would pin one)
DATA_BUCKET = "oa-gcs-usage-dvx"      # sweep runs / plans data (`sweepDispatch`, `api/sweep/*`)
GCP_PROJECT = "oa-internal-450019"    # Batch dispatch (`_lib/gcp.ts`)
GCP_LOG_VIEW = "projects/oa-internal-450019/locations/global/buckets/_Default/views/gcs-sweep-task-logs"
# Each fleet bucket's Batch region (us-central2 has no Batch location → us-central1).
BUCKET_REGIONS = '{"marin-us-east5":"us-east5","marin-us-central1":"us-central1","marin-us-central2":"us-central1","marin-eu-west4":"europe-west4","marin-us-west4":"us-west4","marin-us-east1":"us-east1"}'
SWEEP_IMAGE = "us-central1-docker.pkg.dev/oa-internal-450019/cloud-run-source-deploy/gcs-usage-snapshot@sha256:40a2d0dab5c45937144f4256458e85846bbd43263393768324ba1fd2e48b0ae6"
SWEEP_PACING = "guided"   # Feedback control within the cold-ramp envelope; adaptive after benchmark validation.
CF_ACCOUNT_ID = "74981a43be0de7712369306c7b19133d"
CF_PAGES_SCRIPT = "pages-worker--16777874"   # the project's Functions scripts in the analytics datasets: `<this>-production` / `-preview` (`dt-cloud cf-usage`; the Pages API's `production_script_name`)
D1_DB_ID = "e52398b7-5538-4bc4-83db-3355a1b5ef9a"   # the `DB` binding's D1: executor jobs record their runs there
D1_DB_NAME = "oa-gcs-usage-auth"
DISKY_LABELS = "app=disky,deployment=gcs"  # cost labels on executor jobs (specs/cost-labels.md)
REPO_URL = "https://github.com/Open-Athena/disky"  # the GitHub link (`SiteKbd`/`SiteNav`)
# Snapshots live at the store root (`snapshots/<date>/`); no SNAPSHOTS_SUBDIR.
# No EDGE_TRUSTED / ACCESS_*: the host is off Zero Trust since 2026-09-24 — the
# app's own gate authorizes (Google OIDC client + emailed codes, D1
# `allowed_emails`; specs/done/oidc-cutover.md). No VIEWER_DOMAINS: every
# viewer is an allowlist row (staff included).
# Domain whose sign-in identities are staff (gcs + cw + admin scopes).
STAFF_DOMAIN = "openathena.ai"
# The plans / marks prefix convention (`_lib/plans.ts`): stored prefixes are
# `gs://marin-<bucket>/<path>/`; the six buckets the scan covers, first = primary.
STORE_SCHEME = "gs://"
STORE_BUCKETS = "marin-us-central2,marin-us-central1,marin-us-east1,marin-us-east5,marin-us-west4,marin-eu-west4"
# `/v1/objects`: members preview these buckets' objects in the map (read with
# the store creds — `gcs-usage-browse@` holds objectViewer on each).
OBJECT_BUCKETS = "marin-us-central2,marin-us-central1,marin-us-east1,marin-us-east5,marin-us-west4,marin-eu-west4"
# Viewers stage deletions into a shared open plan (`POST /api/plans/stage`,
# the children table's trash gesture); `stage_batches` exists in this D1.
STAGING = "1"
DUPS = "1"   # the duplicate-candidate report: `/api/dups` + `/dups`, over the `dups` step's report beside each scan's index
# Staged-plan review in Slack (specs/done/staged-slack.md): one thread per staged
# plan in #gcs-admin, with Dry-run / Delete-for-real / Reject-batch buttons
# (`/slack/actions`). `EXECUTOR` is gcs's `Store.executor`: without it the base
# default (`plan-sweep`, cw's) would be dispatched to. Secrets (per environment):
# SLACK_BOT_TOKEN (chat:write, users:read, users:read.email; unset = no threads),
# SLACK_SIGNING_SECRET (unset = `/slack/actions` 503s).
EXECUTOR = "sweep"
SLACK_ADMIN_CHANNEL = "C0C579HNRFB"
# Static name search (2026-10-09): the map's filter and /names read the static
# name index on R2 (INDEX_R2, below), built daily by `job/static-daily.sh`.
# FILTER_STATIC_HEAVY stays dev-only for now (heavy literals on per-scan runs need each run's `drill/`).
FILTER_STATIC = "1"
NAME_SUMMARY_STATIC = "1"
# Only what the static index answers fast and exactly: one plain path-segment
# substring. Regex, globs, exclusions, several terms, `/` and owner/lens scopes
# get an inline "not supported here" (Ryan, 2026-10-09: "just support what's
# fast and robust").
# Heavy literals (catalog members, every 1–2 character term) answer exactly from
# the drilldown (`drill/` on INDEX_R2): the base generation's scans and each
# per-scan run whose drill has landed (`static-names runs add`), so plain
# substring search has no common/rare seam. A broken tier cuts the stack to a
# 400 `scan-not-indexed` for later scans, never a 500 (static-robust).
FILTER_STATIC_HEAVY = "1"
FILTER_INDEXED_ONLY = "1"
META_TREE_URL = "https://gcs.oa.dev/meta"   # /scans outputs link into this site's own /meta tree
# Secondary store `meta` (specs/multi-store.md phase 3): the data behind this site (`oa-gcs-usage-dvx` + the R2 serving
# bucket), scanned by `job/profiles/gcs-meta.yml` (`job/meta-submit.sh`) into `snapshots/meta/` + `meta-l2/` and the
# `store = 'meta'` D1 rows; staff-only (`scope`). Its index tiers are read from `oa-gcs-usage-dvx` with the primary's
# GCS HMAC key (`secrets` names it), its JSONs from INDEX_R2 (`SERVED_R2`), its search from its own static index
# generation (`STATIC_GEN`, built by the profile's `static-names` step). Its age chart reads the change-interval age
# history on INDEX_R2 (`AGE_STORE_PREFIX`, the profile's `age-store` step; specs/age-store.md) for the scans it covers,
# per-scan pyramids otherwise.
STORES_EXTRA = "meta"
STORES_JSON = '{"meta":{"path":"/meta","scope":"admin","vars":{"ROOT_LABEL":"Marin GCS disky metadata","SNAPSHOTS_SUBDIR":"meta","STORE_SCHEME":"gs://","STORE_BUCKETS":"oa-gcs-usage-dvx,oa-gcs-usage-index","STORE_PREFIXES":"meta-l2/,snapshots/meta/","STORE_BUCKET":"oa-gcs-usage-dvx","OBJECT_BUCKETS":"oa-gcs-usage-dvx","SERVED_R2":"1","ROOT_TITLE":"Data behind this site: scans, indexes and listings in oa-gcs-usage-dvx (GCS) and oa-gcs-usage-index (R2)","STATIC_GEN":"2026-10-18metab","FILTER_STATIC_HEAVY":"1","AGE_STORE_PREFIX":"history/meta-age"},"secrets":{"STORE_ACCESS_KEY_ID":"GCS_HMAC_KEY_ID","STORE_SECRET_ACCESS_KEY":"GCS_HMAC_SECRET"}}}'

# Secrets (set with `wrangler pages secret put <NAME> --project-name oa-gcs-usage`):
#   SESSION_SECRET   — HMAC key for session cookies + IP hashing
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — the "gcs.oa.dev (marin-gcs-usage)"
#     OAuth Web client in GCP `oa-auth-509611`
#   RESEND_API_KEY / MAIL_FROM — the emailed sign-in codes (`noreply@oa.dev`)
#   GCS_HMAC_KEY_ID / GCS_HMAC_SECRET — read-only GCS proxy creds (data + /files)
#   GCP_SA_KEY — JSON key for `gcs-usage-dispatch@oa-internal-450019` (Batch
#     submit/cancel for /api/sweep/*; `batch.jobsEditor` + actAs `gcs-usage-job`)

# ---------------------------------------------------------------------------
# Preview environment — the dev stack (`site/deploy --dev` → `--branch dev` →
# https://dev.gcs.oa.dev, a branch alias declared in `cf/`; the raw
# https://dev.oa-gcs-usage.pages.dev resolves too). Real prod data + ledger, unmerged code:
# where a new base or a risky change gets its real numbers before prod. The
# app's own gate applies (same allowlist; sessions are per host). Pages rule:
# `vars`, `d1_databases`, `kv_namespaces` are non-inheritable — the moment ONE
# is overridden here, ALL must be restated, so this block mirrors production
# and differs only where a line says so. Secrets are per-environment too:
# `wrangler pages secret put <NAME> --project-name oa-gcs-usage --env preview`
# (SESSION_SECRET, GOOGLE_CLIENT_*, RESEND_API_KEY/MAIL_FROM, GCS_HMAC_* are set
# there; `GCP_SA_KEY` is not — no sweep dispatch from dev). Google sign-in on
# dev needs `https://dev.gcs.oa.dev` (+ `/auth/google/callback`) registered on
# the OAuth client (done 2026-09-28); the emailed code works regardless.
# ---------------------------------------------------------------------------
[[env.preview.d1_databases]]
binding = "DB"
database_name = "oa-gcs-usage-auth"   # the SAME ledger as prod (marks made on dev are real)
database_id = "e52398b7-5538-4bc4-83db-3355a1b5ef9a"

[env.preview.vars]
SESSION_MONITOR = "0"           # shared D1: preview may dry-run, never send monitor alerts
OA_LOGIN_ISSUER = "https://login.oa.dev"   # "Sign in with OA" (specs/oa-login-rp.md): OA's broker; dev first
OA_LOGIN_CLIENT_ID = "disky-gcs-dev"       # registered at the broker with callback https://dev.gcs.oa.dev/auth/oa/callback; secret OA_LOGIN_CLIENT_SECRET (preview env)
DIFF_DESCENT = "1"   # Δ-mode diffs by lazy descent over the interval store (`_lib/diffDescent.ts`; busy, broad paths handed to the as-of walk); dev only, prod off (Ryan, 2026-11-01: wait for a progressive, one-level-per-request design)
SERVED_R2 = "1"   # snapshot JSONs (meta/age/lifecycle/rules) + extras read from INDEX_R2, not GCS (the job copies them: `publish-r2 -S`)
PATH_STORE = "intervals"   # every request reads the interval store (INDEX_R2) for the scans its generation holds; others read per-scan (`_lib/index.ts`); the generation from INDEX_R2's `interval-store/CURRENT.json`
INTERVAL_STORE_GEN = "2026-10-09b.g3.c"   # dev only: g3 + churn (`backfill-churn`, 2026-11-02) for `/api/diff/level`; frozen at its scans (prod's dailies append to g3), prod follows CURRENT.json
STATIC_BENCH = "1"   # /api/static-bench: R2 read timings for the static name-search prototype
FILTER_STATIC = "1"   # the map's filter (`q=`): a single literal's match roots from the static name index on R2 (INDEX_R2; `_lib/staticFilter.ts`), exact on every scan of its generation
FILTER_STATIC_HEAVY = "1"   # with FILTER_STATIC: heavy literals (catalog members, every 1–2 character one) from the drilldown (`drill/` on INDEX_R2; `_lib/staticDrill.ts`) — match roots, or a heavy directory's per-child rollup; the base generation's scans, and per-scan runs past the drill base once each run's `drill/` lands
FILTER_DETAILS_MS = "300"   # a static filter view waits this long past phase 2 for its roots' own rows (kind, ages, classes), then answers without them
NAME_SUMMARY_STATIC = "1"   # /api/name-summary(-registry): every dated request from the static name index on R2 (INDEX_R2: suffix shards + catalog); unset = the query box (fallback)
FILTER_INDEXED_ONLY = "1"   # as production: only the indexed plain-substring filter
META_TREE_URL = "https://dev.gcs.oa.dev/meta"   # /scans outputs link into this site's own /meta tree
# Secondary store `meta` (specs/multi-store.md phase 3): the data behind this site (`oa-gcs-usage-dvx` + the R2 serving
# bucket), scanned by `job/profiles/gcs-meta.yml` (`job/meta-submit.sh`) into `snapshots/meta/` + `meta-l2/` and the
# `store = 'meta'` D1 rows; staff-only (`scope`). Its index tiers are read from `oa-gcs-usage-dvx` with the primary's
# GCS HMAC key (`secrets` names it), its JSONs from INDEX_R2 (`SERVED_R2`), its search from its own static index
# generation (`STATIC_GEN`, built by the profile's `static-names` step). Its age chart reads the change-interval age
# history on INDEX_R2 (`AGE_STORE_PREFIX`, the profile's `age-store` step; specs/age-store.md) for the scans it covers,
# per-scan pyramids otherwise.
STORES_EXTRA = "meta"
STORES_JSON = '{"meta":{"path":"/meta","scope":"admin","vars":{"ROOT_LABEL":"Marin GCS disky metadata","SNAPSHOTS_SUBDIR":"meta","STORE_SCHEME":"gs://","STORE_BUCKETS":"oa-gcs-usage-dvx,oa-gcs-usage-index","STORE_PREFIXES":"meta-l2/,snapshots/meta/","STORE_BUCKET":"oa-gcs-usage-dvx","OBJECT_BUCKETS":"oa-gcs-usage-dvx","SERVED_R2":"1","ROOT_TITLE":"Data behind this site: scans, indexes and listings in oa-gcs-usage-dvx (GCS) and oa-gcs-usage-index (R2)","STATIC_GEN":"2026-10-18metab","FILTER_STATIC_HEAVY":"1","AGE_STORE_PREFIX":"history/meta-age"},"secrets":{"STORE_ACCESS_KEY_ID":"GCS_HMAC_KEY_ID","STORE_SECRET_ACCESS_KEY":"GCS_HMAC_SECRET"}}}'
