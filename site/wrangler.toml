# CF Pages config for m3's deployment (disk.rbw.sh) — this laptop as the
# `laptop` store (specs/m3-site.md). Private: the app gate, staff =
# runsascoded.com. The index tiers + snapshots are written to R2 `disk-tree`
# by the Batch ingest (`infra/aws/`), footers → D1.
#
# Not yet deployed: disk.rbw.sh still serves `ui/` (Pages project `disk-tree`)
# until Phase 4. The D1 is `infra/cf/`'s (Pulumi): `disk-tree-m3-db`. Migrations:
#   wrangler d1 migrations apply disk-tree-m3-db --remote
name = "disk-tree"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "disk-tree-m3-db"
database_id = "e5288564-a010-4177-9f3c-77e25fad9f72"
migrations_dir = "migrations/cw"

[observability]
enabled = true

[vars]
STORE = "laptop"
AUTH_MODE = "app"
ROOT_LABEL = "m3"
BASE_SCOPE = "laptop"
STAFF_DOMAIN = "runsascoded.com"
ADMIN_EMAILS = "1"                # the `admin_emails` table grants admin (share links can make an account admin)
SNAPSHOTS_SUBDIR = "laptop"      # snapshots/laptop/ (_lib/shared.ts)
INDEX_VARIANTS = "path"          # no ownership → no by-user tiers
STORE_BUCKET = "disk-tree"
STORE_REGION = "auto"
# Staged deletes: plan prefixes are `file:///Users/…/` (the treemap's paths
# start at `Users`), executed by the laptop's drainer (`_lib/laptopDispatch.ts`).
EXECUTOR = "laptop"
STAGING = "1"                     # the opt-in trash: viewers stage (`/api/plans/stage`), the laptop executes
STORE_SCHEME = "file:///"
STORE_BUCKETS = "*"               # every top-level dir is a root (a `capture /`: Applications, Users, …)
HOME = "Users/ryan"               # paths under it read as `~/…` (site/src/pathCrumbs.ts)
# The NAS (specs/multi-store.md): a secondary store at `/nas` (`src/stores/nas.ts`),
# same bucket and keys as the primary, its own `snapshots/nas/` + D1 rows (store `nas`).
STORES_EXTRA = "nas"
STORES_JSON = '{"nas": {"vars": {"ROOT_LABEL": "nas", "SNAPSHOTS_SUBDIR": "nas", "STORE_SCHEME": "file:///", "STORE_BUCKETS": "*", "STORE_BUCKET": "disk-tree", "STORE_REGION": "auto"}, "secrets": {"STORE_ENDPOINT": "STORE_ENDPOINT", "STORE_ACCESS_KEY_ID": "STORE_ACCESS_KEY_ID", "STORE_SECRET_ACCESS_KEY": "STORE_SECRET_ACCESS_KEY"}}}'
# Secrets (Pages secrets at deploy; `.dev.vars` locally): STORE_ENDPOINT,
# STORE_ACCESS_KEY_ID, STORE_SECRET_ACCESS_KEY, SESSION_SECRET.
