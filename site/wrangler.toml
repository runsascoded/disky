# CF Pages project config (oa-cw-s3-usage → cw.oa.dev; cw-s3.oa.dev redirects, specs/done/rename-cw.md). `wrangler pages
# deploy` reads this, so bindings + vars declared here apply to the deployment
# it creates. The deployment's own sign-in (Google OIDC + emailed codes, the
# `@open-athena/auth` session model) gates the whole host; D1's schema is
# `site/schema.sql` (auth tables + the staged-deletion tables).
name = "oa-cw-s3-usage"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"
compatibility_flags = ["enable_request_signal"]  # interval-store reads evict a cancelled request's in-flight fetches

# Staged-deletion store (specs/staged-delete.md): D1 holds the plans, the
# executed-deletion records, and the admin allowlist (`site/schema.sql`).
# Create with `wrangler d1 create oa-cw-s3-usage-db` and paste the returned
# database_id below, then `wrangler d1 execute oa-cw-s3-usage-db --remote
# --file site/schema.sql` (needs CLOUDFLARE_ACCOUNT_ID=74981a43… + the D1-scoped token).
[[d1_databases]]
binding = "DB"
database_name = "oa-cw-s3-usage-db"
database_id = "7f1e1326-b879-4ecd-8621-846621c24f36"
# Its schema is `site/schema.sql` (one current-state file; `dt-cloud d1-schema check -d oa-cw-s3-usage-db`).
# Local dev runs against the REAL prod D1 (read-write) — dev-only: deploys
# ignore `remote`. Needs CLOUDFLARE_API_TOKEN (direnv) + CLOUDFLARE_ACCOUNT_ID.
remote = true

# Workers Logs: retain console output + uncaught exceptions from the Pages
# Functions (a few days, in the dashboard) — without this a 500 leaves no trace
# once the request is gone (`wrangler pages deployment tail` is live-only).
[observability]
enabled = true

[vars]
ROOT_LABEL = "Marin CoreWeave"  # the store root's crumb label (`_lib/view.ts`)
# Deployment as configuration (the base's `vite.config.ts` reads these from
# this file at build time; `src/stores.ts` registry key + client whoami source):
STORE = "cw"                    # the store this build serves (`src/stores.ts`)
MARK = "cw"                     # favicon/badge: the CoreWeave mark (`public/icons/cw*`; the build injects the links)
PROD_HOST = "cw.oa.dev"         # `g d` toggles with DEV_HOST (src/hosts.ts)
DEV_HOST = "dev.cw.oa.dev"
# The rename (specs/done/rename-cw.md): the old hosts stay attached and 301 GETs here (`_lib/hostRedirect.ts`)
HOST_REDIRECTS = "cw-s3.oa.dev=cw.oa.dev,dev.cw-s3.oa.dev=dev.cw.oa.dev"
AUTH_MODE = "app"                # own sign-in: Google OIDC + emailed codes (specs/done/oidc-cutover-cw.md P4, 2026-09-28)
OG_CARDS = "1"
OG_ANONYMOUS = "full"            # Link previews show the full card (labelled tiles, sizes, owners): the site stays behind
                                 # sign-in, its unfurls don't (Ryan 2026-10-16: OA's storage is gifted, the project's
                                 # transparency is a feature; gcs keeps "generic")
OG_DEFAULT_COLOR = "t"           # Match CW's frontend default
# The plan prefix shape (`_lib/plans.ts` prefixShape): CoreWeave's S3-compatible
# buckets; explicit here so the deployment declares it rather than inheriting a default.
STORE_SCHEME = "s3://"
STORE_BUCKETS = "marin-us-east-02a,hero-checkpoints,marin-us-east-06a,rhoarnet-us-east-08a,marin-us-east-08a,marin-us-west-04a,marinfold-exp368-rno2a,marin-rno2a"
BASE_SCOPE = "cw"
SNAPSHOTS_SUBDIR = "cw"          # this store's snapshots: snapshots/cw/ (`_lib/shared.ts` snapshotsPrefix)
# The store seam's read allow-list (`_lib/index.ts` storePrefixes, also honored
# by `/api/path-index` and `/v1/files`): the base's defaults cover `listing/`
# and `snapshots/` only; cw's index tiers live under `cw-l2/` and its sweep
# records under `cw-sweep/`, so name them here (this REPLACES the defaults).
STORE_PREFIXES = "listing/,snapshots/,sweep/,cw-sweep/,cw-l2/"
# Domain whose sign-in identities are staff (admin/sweep scope). CoreWeave
# viewers (coreweave.com) can see the dashboard but are not staff; the
# sweep-dispatch admin gate is the `admin_emails` (`site/schema.sql`)
# allowlist on top of this (`ADMIN_EMAILS` says the table exists here).
STAFF_DOMAIN = "openathena.ai"
ADMIN_EMAILS = "1"
# Sweep executor config (specs/oa-decoupling.md step 0; today's cwBatch/gcp.ts
# values, which `cloud` stops defaulting): the plan-sweep job's data bucket,
# GCP project, image and CoreWeave S3 endpoint.
DATA_BUCKET = "oa-cw-s3-usage-data"
SWEEP_REVIEW_STORE = "r2://oa-cw-s3-usage-index"
SWEEP_REVIEW_SECRETS = '{"R2_ENDPOINT":"cw-s3-r2-endpoint","R2_ACCESS_KEY_ID":"cw-s3-isolated-r2-access-key-id","R2_SECRET_ACCESS_KEY":"cw-s3-isolated-r2-secret-access-key"}'
GCP_PROJECT = "oa-internal-450019"
META_TREE_URL = "https://cw.oa.dev/meta"  # /scans outputs link into the meta tree
SWEEP_IMAGE = "us-central1-docker.pkg.dev/oa-internal-450019/cw-s3-usage/scan:latest"
DISKY_LABELS = "app=disky,deployment=cw-s3"  # cost labels on executor jobs (specs/cost-labels.md)
SWEEP_S3_ENDPOINT = "https://cwobject.com"
REPO_URL = "https://github.com/Open-Athena/marin-gcs-usage"  # the site's "Source on GitHub" link (build-time)
# The in-app viewer policy (specs/done/oidc-cutover-cw.md): these domains get the
# `cw` scope with no `allowed_emails` row.
VIEWER_DOMAINS = "coreweave.com"
# The opt-in trash model (specs/staged-delete.md): any full viewer stages
# deletions into the shared open plan (`stage_batches`, `site/schema.sql`).
STAGING = "1"
# Staged-plan review in Slack (specs/done/staged-slack.md): one thread per staged plan
# in #cw-s3-admin; `EXECUTOR` = the Store's executor, which says the Slack
# buttons may dispatch (plan-sweep). Secrets: SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET.
SLACK_ADMIN_CHANNEL = "C0C53CPM886"
EXECUTOR = "plan-sweep"
# The Batch job account the sweep console dispatches as (`infra/gcp`: `cw-s3-job`;
# `GCP_SA_KEY` is the `cw-s3-dispatch` key that may act as it).
JOB_SA = "cw-s3-job@oa-internal-450019.iam.gserviceaccount.com"
# R2 serving (specs/done/r2-serving-migration.md): the same store seam the base's
# r2.rbw.sh deploy uses (`_lib/index.ts` storeTarget/storeCreds — S3-over-R2,
# NOT a native R2 binding, so cw matches the base byte-for-byte). The bucket is
# the `r2_bucket` output of the `cw-s3` Pulumi stack (`cf/`); the job publishes
# each scan's served subset into it (`job/cw-run.sh` stage 4c, `dt-cloud
# publish-r2`), so the reads are byte-equivalent to GCS (same keys). FLIPPED
# 2026-09-28 (after the dev stack, 2026-09-25). The three secrets below MUST be
# set on the same environment as these two vars — `cf/sync-secrets -P` — and
# the vars must never be dropped while the secrets stay: a seam-aware build
# with the creds but no `STORE_BUCKET` reads R2 with the GCS bucket name and
# 404s every data route (the 2026-09-25 hotfix incident).
# Secrets (`cf/sync-secrets -p -P`, or `wrangler pages secret put <NAME> --project-name oa-cw-s3-usage`):
#   STORE_ENDPOINT          = https://<account id>.r2.cloudflarestorage.com
#   STORE_ACCESS_KEY_ID     = the `r2_s3_access_key_id` stack output (the R2 API token's id)
#   STORE_SECRET_ACCESS_KEY = the `r2_s3_secret_access_key` stack output (sha256 of the token value)
# `STORE_PREFIXES` is set above (the base's defaults no longer include `cw-l2/`).
STORE_BUCKET = "oa-cw-s3-usage-index"   # `r2_bucket` output; R2 ignores the region, SigV4 wants one
STORE_REGION = "auto"
# Secondary store `meta` (specs/multi-store.md phase 3): the deploy's own
# storage — the GCS data bucket + this R2 bucket — scanned daily by
# job/profiles/cw-meta.yml (scan.nf) and served at /meta to staff. ENABLED 2026-09-30 in this
# order (Ryan's go for each): (1) prod D1 gets the store-scoped index tables (now in
# `site/schema.sql`); (2) a first
# `job/cw-meta-submit.sh` run lands `snapshots/meta/<scan>/` + `meta-l2/` and
# the `store = 'meta'` D1 rows; (3) uncomment BOTH lines below (in both envs)
# and deploy — `STORES_EXTRA` mounts the page, `STORES_JSON` gives the
# Functions its data. The store reuses the primary's R2 secrets (same bucket,
# named by binding in `secrets`), so no new Pages secret is needed.
# Its own static name index (`?f=` on /meta): `STATIC_GEN` names its generation in INDEX_R2, built and
# appended by job/profiles/cw-meta.yml's `static-names` step; without one its search is `scan-not-indexed`, never the primary's.
STORES_EXTRA = "meta"
STORES_JSON = '{"meta":{"scope":"admin","path":"/meta","vars":{"ROOT_LABEL":"Marin CW disky metadata","SNAPSHOTS_SUBDIR":"meta","STORE_SCHEME":"gs://","STORE_BUCKETS":"oa-cw-s3-usage-data,oa-cw-s3-usage-index","STORE_PREFIXES":"meta-l2/,snapshots/meta/","STORE_BUCKET":"oa-cw-s3-usage-index","STORE_REGION":"auto","ROOT_TITLE":"Data behind this site: scans, indexes and listings in oa-cw-s3-usage-data (GCS) and oa-cw-s3-usage-index (R2)","STATIC_GEN":"2026-10-18meta","FILTER_STATIC_HEAVY":"1"},"secrets":{"STORE_ENDPOINT":"STORE_ENDPOINT","STORE_ACCESS_KEY_ID":"STORE_ACCESS_KEY_ID","STORE_SECRET_ACCESS_KEY":"STORE_SECRET_ACCESS_KEY"}}}'

# Static name search (specs/architecture/static-name-search.md, specs/static-append.md): the map's `?f=` filter
# and /names read cw's static name index from its R2 bucket (INDEX_R2, below; the generation `static-names/CURRENT.json`
# names, which a compaction moves; no `STATIC_GEN` pin), under `static-names/<gen>/`, built by `job/static-names.sh` with `STATIC_NAMES_PROFILE=cw`, appended per scan by
# the scan job's stage 4f). The hex-run generation (specs/static-hex-runs.md), light index and drill both on R2;
# heavy terms read the drill. Same values as `[env.preview.vars]`.
FILTER_STATIC = "1"
NAME_SUMMARY_STATIC = "1"
FILTER_STATIC_HEAVY = "1"
FILTER_INDEXED_ONLY = "1"   # as gcs: the filter is the static name index only (no per-scan search sidecars)
SERVED_R2 = "1"   # snapshot JSONs + extras read through INDEX_R2 (the same bucket as `STORE_BUCKET`), not the S3 seam
PATH_STORE = "intervals"   # every request reads the interval store (INDEX_R2) for the scans its generation holds, the one `interval-store/CURRENT.json` names (no `INTERVAL_STORE_GEN` pin: compactions move it); others read per-scan (`_lib/index.ts`)

# Worker-served indexes (the static name index), read through a native binding (the store seam's S3 creds are
# for the path store; this is the same bucket).
[[r2_buckets]]
binding = "INDEX_R2"
bucket_name = "oa-cw-s3-usage-index"

# Global cache tier for the index reader's JSON (`functions/_lib/edgeCache.ts`:
# colo cache → KV; gcs binds `CACHE_KV`). Optional — the code runs without it
# (colo cache only), but then the job's warm-cache reaches ONE datacenter.
# The namespace is the `cache_kv_id` output of this branch's CF Pulumi stack
# (`cf/__main__.py`, Store.kv_name = "oa-cw-s3-usage-cache"), created 2026-09-25.
[[kv_namespaces]]
binding = "CACHE_KV"
id = "1dbc4c60884c4f3ba61aa1aa79f494bc"

# Secrets (set with `wrangler pages secret put <NAME> --project-name oa-cw-s3-usage`):
#   SESSION_SECRET   — HMAC key for session cookies + IP hashing (the app
#     session model, specs/done/oidc-cutover-cw.md; absent = sign-in 503s)
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET — the "cw-s3.oa.dev" OAuth Web client (its origins include cw.oa.dev)
#   RESEND_API_KEY / MAIL_FROM — emailed-code sign-in (noreply@oa.dev)
#   GCS_HMAC_KEY_ID / GCS_HMAC_SECRET — read-only GCS proxy creds (data + /files)
#   GCP_SA_KEY — JSON key for `gcs-usage-dispatch@oa-internal-450019` (Batch
#     submit/cancel for /api/sweep/*; `batch.jobsEditor` + actAs `gcs-usage-job`)
#   SLACK_BOT_TOKEN — the deployment's Slack app bot token (`chat:write`,
#     `users:read`, `users:read.email`); unset = no staged-plan threads
#   SLACK_SIGNING_SECRET — that app's signing secret; unset = `/slack/actions` 503s

# ---------------------------------------------------------------------------
# Preview environment — the dev stack (`site/deploy --dev` → `--branch dev` →
# https://dev.cw.oa.dev (dev.cw-s3.oa.dev redirects), a CNAME onto the branch alias
# dev.oa-cw-s3-usage.pages.dev; `cf/` owns the record). Same sign-in as
# production (Google OIDC + emailed codes). Real prod data, unmerged code:
# where the R2 / KV flips and a new base get their real numbers before prod.
# Pages rule: `vars`, `d1_databases`, `kv_namespaces` are non-inheritable — the
# moment ONE is overridden here, ALL must be restated, so this block mirrors
# production and differs only where a line says so. Secrets are per-environment
# too: `wrangler pages secret put <NAME> --project-name oa-cw-s3-usage --env preview`
# (the GCS HMAC pair is set there; `GCP_SA_KEY` is not — no sweep dispatch from dev).
# ---------------------------------------------------------------------------
