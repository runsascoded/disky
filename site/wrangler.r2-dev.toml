# CF Pages config for the DEV mirror (dev.r2.rbw.sh) — a staging copy of the
# public r2.rbw.sh Map. Same D1 + index bucket (reads the *same* public data),
# so it's a code/UI preview of what a `cloud`-branch push will ship to prod.
# Its production branch is `dev`; deploy the `dev` branch here, `cloud` to the
# `disk-tree-demo` project. Only `name` + `ROOT_LABEL` differ from wrangler.r2.toml.
# (deploy-r2.yml does all of this on a push to `dev`.)
#
# Deploy:  WRANGLER_CONFIG=wrangler.r2-dev.toml pnpm build   (vite.config.ts reads STORE/AUTH_MODE below)
#   swap this in as wrangler.toml (Pages rejects -c), then
#   wrangler pages deploy dist --project-name disk-tree-demo-dev --branch dev
name = "disk-tree-demo-dev"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "disk-tree-demo-db"
database_id = "261d0c80-8f73-442e-979a-4e25725b2271"
remote = true

[observability]
enabled = true

[vars]
# The prod ↔ dev host pair (`src/hosts.ts`, read at build time): `g d` / `g D` open this page on the other one.
PROD_HOST = "r2.rbw.sh"
DEV_HOST = "dev.r2.rbw.sh"
STORE = "r2"                     # build-time: the `src/stores.ts` registry key (vite.config.ts)
AUTH_MODE = "public"             # build-time: no sign-in wall (src/auth.ts)
MARK = "r2"                      # build-time: favicon + badge, `public/icons/r2.*` (vite.config.ts)
ROOT_LABEL = "Public R2 Treemap Demo (dev)"
BASE_SCOPE = "r2"
OG_CARDS = "1"
STORE_SCHEME = "r2://"
PUBLIC_READ = "1"
SNAPSHOTS_SUBDIR = "r2"
FILTER_INDEXED_ONLY = "1"        # search is the static name index only (every deployment): a form it can't answer is refused, never walked
STORE_BUCKET = "disk-tree-demo"
STORE_REGION = "auto"
# The `/meta` store, as wrangler.r2.toml's (the same bucket, prefixes, static generation and read secrets).
STORES_EXTRA = "meta"
STORES_JSON = '{"meta":{"path":"/meta","vars":{"ROOT_LABEL":"Public R2 Treemap Demo disky metadata (dev)","ROOT_TITLE":"Data behind this site: the daily scans’ indexes, snapshots and name index in disk-tree-demo (R2)","SNAPSHOTS_SUBDIR":"meta","STORE_SCHEME":"r2://","STORE_BUCKETS":"disk-tree-demo","STORE_PREFIXES":"meta-l2/,snapshots/meta/","STORE_BUCKET":"disk-tree-demo","STORE_REGION":"auto","STATIC_GEN":"2026-10-19meta","FILTER_STATIC_HEAVY":"1"},"secrets":{"STORE_ENDPOINT":"STORE_ENDPOINT","STORE_ACCESS_KEY_ID":"STORE_ACCESS_KEY_ID","STORE_SECRET_ACCESS_KEY":"STORE_SECRET_ACCESS_KEY"}}}'

# Store-read secrets (STORE_ENDPOINT, STORE_ACCESS_KEY_ID, STORE_SECRET_ACCESS_KEY)
# are set on the dev project's production env (it serves the `dev` branch), the
# same values as prod — see `wrangler pages secret put ... --project-name
# disk-tree-demo-dev`, kept out of this public repo.
