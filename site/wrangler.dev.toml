# CF Pages config for dev.disk.rbw.sh — the `site/` preview / staging mirror of
# m3's deployment, a SEPARATE Pages project (`disk-tree-dev`, cf/) over the
# same store, index and D1 as production (`wrangler.toml`), so it shows real
# numbers for unmerged work. Deploy: `site/deploy-m3 --dev` (swaps this in as
# wrangler.toml for the build + deploy, as deploy-r2.yml does for
# dev.r2.rbw.sh — Pages rejects a custom config path).
name = "disk-tree-dev"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

[[d1_databases]]
binding = "DB"
database_name = "disk-tree-m3-db"
database_id = "e5288564-a010-4177-9f3c-77e25fad9f72"
remote = true

# The static name index (`static-names/<STATIC_GEN>/`, written by the Batch ingest's
# `dt-cloud static-names`): exact `?f=` once FILTER_STATIC is on.
[[r2_buckets]]
binding = "INDEX_R2"
bucket_name = "disk-tree"

[observability]
enabled = true

[vars]
STORE = "laptop"
AUTH_MODE = "app"
ROOT_LABEL = "m3 (dev)"          # distinguishes dev.disk.rbw.sh from prod at a glance
PROD_HOST = "disk.rbw.sh"        # `g d` toggles with DEV_HOST (src/hosts.ts)
DEV_HOST = "dev.disk.rbw.sh"
# The tab icon (`public/icons/`, scripts/marks): the ⌘ mark on the laptop's pages; the NAS store's are its own (`src/stores/nas.ts` `mark`).
MARK = "macos"
BASE_SCOPE = "laptop"
STAFF_DOMAIN = "runsascoded.com"
ADMIN_EMAILS = "1"                # the `admin_emails` table grants admin (share links can make an account admin)
SNAPSHOTS_SUBDIR = "laptop"
INDEX_VARIANTS = "path"
STORE_BUCKET = "disk-tree"
STORE_REGION = "auto"
EXECUTOR = "laptop"
STAGING = "1"                     # the opt-in trash: viewers stage (`/api/plans/stage`), the laptop executes
STORE_SCHEME = "file:///"
STORE_BUCKETS = "*"               # every top-level dir is a root (a `capture /`: Applications, Users, …)
HOME = "Users/ryan"               # paths under it read as `~/…` (site/src/pathCrumbs.ts)
# The NAS (specs/multi-store.md): a secondary store at `/nas` (`src/stores/nas.ts`),
# same bucket and keys as the primary, its own `snapshots/nas/` + D1 rows (store `nas`).
# The static name index's generation (the job env's STATIC_GEN, infra/aws/Pulumi.rac.yaml; a test pins
# them equal). The NAS (a secondary store) has none: its literals answer `scan-not-indexed`.
STATIC_GEN = "2026-10-15"
FILTER_STATIC = "1"
FILTER_STATIC_HEAVY = "1"
# Search from the static name index only: one plain syntax, never a path-store scan (an unindexed form is a 400
# `{ error, code }`, `_lib/indexedOnly.ts`).
FILTER_INDEXED_ONLY = "1"
# The interval store (`interval-store/CURRENT.json`, appended by each ingest; specs/m3-interval-store.md) serves the
# path sorts; `?ps=scan` reads a request from the per-scan sorts instead (the parity check).
PATH_STORE = "intervals"
# The meta store (`/meta`, `src/stores/meta.ts`, admins only): the bucket itself, scanned beside each laptop
# capture (`meta-l2/`, `snapshots/meta/`, D1 store `meta`); its STATIC_GEN is the job env's META_STATIC_GEN.
STORES_EXTRA = "nas,meta"
STORES_JSON = '{"nas": {"path": "/nas", "vars": {"ROOT_LABEL": "nas", "SNAPSHOTS_SUBDIR": "nas", "STORE_SCHEME": "file:///", "STORE_BUCKETS": "*", "STORE_BUCKET": "disk-tree", "STORE_REGION": "auto", "STORE_ROOT": "mnt/user"}, "secrets": {"STORE_ENDPOINT": "STORE_ENDPOINT", "STORE_ACCESS_KEY_ID": "STORE_ACCESS_KEY_ID", "STORE_SECRET_ACCESS_KEY": "STORE_SECRET_ACCESS_KEY"}}, "meta": {"path": "/meta", "scope": "admin", "vars": {"ROOT_LABEL": "meta", "SNAPSHOTS_SUBDIR": "meta", "STORE_SCHEME": "r2://", "STORE_BUCKETS": "disk-tree", "STORE_PREFIXES": "meta-l2/,snapshots/meta/", "STORE_BUCKET": "disk-tree", "STORE_REGION": "auto", "STATIC_GEN": "2026-10-18meta", "FILTER_STATIC_HEAVY": "1"}, "secrets": {"STORE_ENDPOINT": "STORE_ENDPOINT", "STORE_ACCESS_KEY_ID": "STORE_ACCESS_KEY_ID", "STORE_SECRET_ACCESS_KEY": "STORE_SECRET_ACCESS_KEY"}}}'
# File previews from the laptop itself, admins only (specs/laptop-file-tunnel.md): the tunnel
# (`infra/cf` `fileTunnel`) and the paths a preview never serves (globs from `/`).
LAPTOP_TUNNEL_URL = "https://disk-files.rbw.sh"
LAPTOP_FILES_DENY = "Users/*/.ssh/**,Users/*/.aws/**,Users/*/.gnupg/**,Users/*/.config/gcloud/**,Users/*/.kube/**,Users/*/.docker/config.json,Users/*/.netrc,Users/*/Library/Keychains/**,Users/*/Library/Application Support/Google/Chrome/**,Users/*/Library/Application Support/Superhuman/**,Users/*/Library/Cookies/**,**/.env*,**/*.pem,**/*.key,**/*.p12"
# Secrets (Pages secrets, per project): STORE_ENDPOINT, STORE_ACCESS_KEY_ID,
# STORE_SECRET_ACCESS_KEY, SESSION_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# LAPTOP_TUNNEL_CLIENT_ID, LAPTOP_TUNNEL_CLIENT_SECRET (`pulumi stack output file_tunnel_client_{id,secret}`, infra/cf).
