# `scripts/branch-harmony`'s classification of own-delta files (spec `specs/branch-harmony-audit.md` §Classification).
# First match wins: `lanes` (optional) scopes a rule; `paths` are fnmatch globs (`*` also matches `/`).
# `class`: `intrinsic` (keep: config, migrations, deployment glue, store-intrinsic code), `accidental` (should not
# differ: the reason names the move and its owner), or `mixed` (one file holding both; the reason says which part
# moves). A file the parent already has byte-identical is `lag` whatever the rules say: the next merge clears it.
# Reviewed 2026-11-12 against: gcs o/gcs 072530ad5, cw o/cw ea07bac73, hf o/hf babe96ddc, r2 o/r2 738a5c6e4,
# local r/local 8b9ee4d5f, m3 r/m3 32d10e93b, app tauri-native-app 76f1f572f, cloud d3c0c4afb.
rules:
  # ---- accidental: shared across siblings (duplicates, holds, identical edits) ----
  - paths: [site/src/oaPeers.ts]
    class: accidental
    reason: "dup: byte-identical on gcs/cw/hf/r2, absent from cloud, edited 4x for one change (4e24e505f/45f8a6f25/c62d0efb2/6e9cb1738) -> config: a `PEERS_JSON` var each wrangler.toml sets, read by cloud's `peers`"
  - paths: [site/functions/_lib/diffLookups.test.ts, site/functions/api/diff.ts, site/functions/api/me.test.ts, site/functions/api/scopedKey.test.ts]
    lanes: [gcs, cw]
    class: accidental
    reason: "hold: gcs a12a3bd02 + cw 410f0338e revert cloud's diff lookups (dd6b0650, 4bc60b3c, e7c3ba97, 196896c5) pending a 2.7x diff-body measurement -> root: measure, then keep (gcs/cw drop the revert) or revert on cloud; meanwhile a cloud flag (`DIFF_LOOKUPS=v1`) instead of a code revert"
  - paths: [site/functions/_lib/pathStore.test.ts, site/functions/_lib/staticDrill.test.ts]
    lanes: [cw]
    class: accidental
    reason: "hold: cw 410f0338e's diff-lookups revert (as gcs) -> as the revert"
  - paths: [job/gen-delta-arrows.py, job/gen-arrow-avatars.py, job/icons/_headers, job/rerg]
    lanes: [gcs, cw]
    class: accidental
    reason: "dup: same file on gcs and cw (rerg: 4 lines apart), absent from cloud, flagged 10-10 and 10-17 -> pick to cloud `job/` (rerg's account/region as args), both drop theirs"
  - paths: [infra/cf/run]
    lanes: [cw, hf]
    class: accidental
    reason: "dup: byte-identical on cw and hf, absent from cloud -> pick to cloud `infra/cf/run`"
  - paths: [job/static-names.sh]
    lanes: [gcs, cw]
    class: accidental
    reason: "near-dup: one launcher on gcs and cw (120 of ~190 lines apart), the per-deployment part already in `job/static-names.json` -> one cloud launcher reading the profile; both drop theirs"
  - paths: [Dockerfile, cloudbuild.yaml, job/build.sh, job/Dockerfile, job/cloudbuild.yaml]
    lanes: [gcs, cw, hf, r2]
    class: accidental
    reason: "near-dup glue: four copies of the job image build; image-sha stamping landed 4x (gcs 7987fc159, cw 6e1dbb777, hf 74b3b7ac1, r2 2b978ee2d), pages-kit copy 2x -> a cloud `job/build.sh` + `job/Dockerfile` parameterized by an image env file each deployment keeps"
  - paths: [site/wrangler.example.toml]
    lanes: [gcs, cw]
    class: accidental
    reason: "template drift: cloud's documented example edited on a deployment (gcs 040b32571 merge leftover; cw 50ce9fcec history vars + overlay notes) -> cw's lines ride the history pick; gcs drops its 2 lines"

  # ---- accidental: gcs ----
  - paths: [cloud/src/dt_cloud/session_monitor.py, cloud/tests/test_session_monitor.py, site/functions/_lib/sessionMonitor.ts, site/functions/_lib/sessionMonitor.test.ts, site/functions/api/session-monitor.ts, job/session-monitor.json]
    lanes: [gcs]
