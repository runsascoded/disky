  - paths: [site/src/ScansPage.tsx, site/src/runChart.ts, site/src/runChart.test.ts, site/src/scans.scss]
    lanes: [gcs]
    class: accidental
    reason: "shared UI on gcs only: 74bfa26d5 'Compact /scans rows and expose job-type filters and output sizes', b2abddfa7 (untagged, 11-10), + f809c64ed's access-ingest rows -> pick to cloud"
  - paths: [cloud/src/dt_cloud/scan_runs.py, cloud/src/dt_cloud/scan_runs_backfill.py, cloud/tests/test_scan_runs.py, site/functions/_lib/health.ts, site/functions/_lib/health.test.ts, site/functions/_lib/scanRuns.ts, site/src/scanRunsModel.ts, site/functions/_lib/accessIngestRuns.test.ts]
    lanes: [gcs]
    class: accidental
    reason: "generic seam in a gcs feature: f809c64ed's `JobKind.single_phase`/`nop_marker` and standalone-run rows are profile-driven -> pick the mechanism to cloud, gcs keeps only `job/scan-runs.json`'s access-ingest entry"
  - paths: [cloud/src/dt_cloud/owner_carry.py, cloud/tests/test_owner_carry.py, cloud/src/dt_cloud/append_runner.py, cloud/src/dt_cloud/interval_append.py, cloud/src/dt_cloud/static_profile.py, site/functions/_lib/intervalSlices.test.ts]
    lanes: [gcs]
    class: accidental
    reason: "cloud feature's fix on gcs only: 4c49983d2 carries cloud's `owner_prefix_aggs` across a compaction (opt-in `owner_carry`) -> pick to cloud (opt-in stays per profile)"
  - paths: [site/functions/_lib/activity.ts, site/functions/_lib/activityShape.ts, site/src/ActivityPage.tsx]
    lanes: [gcs]
    class: accidental
    reason: "merge residue: `StoredBurst` moved to activityShape.ts on gcs only (a7243fb7c/7cbc17a16 resolutions) -> pick the move to cloud or take cloud's"
  - paths: [site/e2e/guest-chip.spec.ts]
    lanes: [gcs]
    class: accidental
    reason: "cosmetic: a spec path comment (`specs/done/`) fixed on gcs only -> pick"
  - paths: [scripts/spec-audit.py, tests/test_spec_audit.py]
    lanes: [gcs]
    class: accidental
    reason: "generic repo tool on gcs only -> pick to cloud `scripts/`"
  - paths: [cloud/src/dt_cloud/interval_store.py]
    lanes: [gcs]
    class: mixed
    reason: "`CLASS_COLS` named for GCS classes is intrinsic (standalone); `_cut`'s per-sort worker split is shared perf code -> pick that hunk"
  - paths: [cloud/src/dt_cloud/cli.py]
    lanes: [gcs]
    class: accidental
    reason: "registrations for the expired session monitor (drop) and 552411a40's `cf-generations` (pick)"
  - paths: [site/functions/_lib/auth.ts]
