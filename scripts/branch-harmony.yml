  # ---- accidental: cw ----
  - paths: [cloud/src/dt_cloud/history_jobs.py, cloud/src/dt_cloud/history_verify.py, cloud/src/dt_cloud/scan_thinning.py, cloud/src/dt_cloud/static_thinning.py, cloud/src/dt_cloud/interval_thinning.py, cloud/tests/test_history_jobs.py, cloud/tests/test_history_verify.py, cloud/tests/test_scan_thinning.py, cloud/tests/test_static_thinning.py, cloud/tests/test_interval_thinning.py, site/functions/_lib/history*.ts, site/functions/api/admin/history*.ts, site/src/HistoryAdmin*, site/src/scanRetention*.ts, site/src/ScansPage.tsx, site/src/scans.scss, site/src/AdminPage.tsx, site/functions/_lib/index.ts, site/functions/_lib/auth.ts, site/functions/_lib/usage.ts, site/functions/_lib/usage.test.ts, site/functions/_middleware.ts, site/functions/gates.test.ts, cloud/src/dt_cloud/static_local.py, cloud/src/dt_cloud/interval_compact.py, cloud/src/dt_cloud/cli.py]
