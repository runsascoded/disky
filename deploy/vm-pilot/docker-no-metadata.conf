# A drop-in for docker.service on the VM pilot's box (bootstrap.sh: `docker.service.d/no-metadata.conf`): job
# containers can't reach the metadata server, so none can take the box's own token (and through it mint another
# tenant's). A job's identity is only the token the local job backend minted for its spec's account. Only TCP other than
# port 53 is refused: the same address is GCE's DNS resolver (the host's resolv.conf, which containers inherit), and
# refusing all of it broke every container's name lookups (the box's first boot, 2026-11-28: cargo couldn't resolve
# index.crates.io). The metadata server answers HTTP on TCP 80; DNS is UDP / TCP 53.
[Service]
ExecStartPost=/bin/sh -c 'iptables -C DOCKER-USER -d 169.254.169.254/32 -p tcp ! --dport 53 -j REJECT --reject-with tcp-reset 2>/dev/null || iptables -I DOCKER-USER -d 169.254.169.254/32 -p tcp ! --dport 53 -j REJECT --reject-with tcp-reset'
