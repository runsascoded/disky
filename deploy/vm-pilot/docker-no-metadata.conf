# A drop-in for docker.service on the VM pilot's box (bootstrap.sh: `docker.service.d/no-metadata.conf`): job
# containers can't reach the metadata server, so none can take the box's own token (and through it mint another
# tenant's). A job's identity is only the token the local job backend minted for its spec's account.
[Service]
ExecStartPost=/bin/sh -c 'iptables -C DOCKER-USER -d 169.254.169.254/32 -j REJECT 2>/dev/null || iptables -I DOCKER-USER -d 169.254.169.254/32 -j REJECT'
