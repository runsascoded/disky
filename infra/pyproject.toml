[project]
name = "disky-infra"
version = "0.1.0"
description = "Pulumi components for a deployment's Cloudflare (`cf/`), GCP (`gcp/`) and AWS (`aws/`) resources; each deployment branch adds its own stack programs"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.34",              # aws/build-image
    "click>=8",                 # aws/build-image
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-aws==7.48.0",        # what m3's state was written with
    "pulumi-command>=1.0.0,<2.0.0",
    "pulumi-cloudflare>=6.0.0,<7.0.0",
    "pulumi-gcp>=9.0.0,<10.0.0",
]
