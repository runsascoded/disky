[project]
name = "disky-infra"
version = "0.1.0"
description = "Pulumi components for a deployment's Cloudflare (`cf/`) and GCP (`gcp/`) resources; each deployment branch adds its own stack programs"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-cloudflare>=6.0.0,<7.0.0",
    "pulumi-gcp>=9.0.0,<10.0.0",
]
