config:
  aws:region: us-east-1
  # RAC AWS (006196295121, `AWS_PROFILE=r` from the worktree's `.envrc`).
  # Sized from the Phase 0 run: path-index peaked at 1.5 GiB over 6.6M files.
  disk-tree-m3:prefix: disk-tree-m3
  # The resources were declared at the stack root before `BatchIngest`.
  disk-tree-m3:moved_from_root: "true"
  # The image build's inputs, relative to the repo root (zipped, content-hashed).
  disk-tree-m3:dockerfile: infra/aws/Dockerfile
  disk-tree-m3:sources:
    - pyproject.toml
    - uv.lock
    - README.md
    - src
    - cloud/pyproject.toml
    - cloud/src
    - infra/aws/Dockerfile
    - infra/aws/ingest.sh
    - infra/aws/scan-runs.json
  disk-tree-m3:vcpu: "2"
  disk-tree-m3:memory_mib: "16384"
  disk-tree-m3:ephemeral_gib: "120"
  disk-tree-m3:env:
    R2_ENDPOINT_URL: https://0dcad5654e9744de6616f74b8df4af63.r2.cloudflarestorage.com
    # index-sync → the site's D1 (cf/: `disk-tree-m3-db`)
    CLOUDFLARE_ACCOUNT_ID: 0dcad5654e9744de6616f74b8df4af63
    D1_DB_ID: e5288564-a010-4177-9f3c-77e25fad9f72
    D1_DB_NAME: disk-tree-m3-db
    INDEX_VARIANTS: path
    # Capture host → store (ingest.sh): this Mac is the primary (`laptop`), the NAS its own store;
    # any other host is refused (specs/device-enrollment.md).
    PRIMARY_HOST: m3
    HOST_STORES: nas=nas
    # Record each ingest as a scan run in D1 (`/scans`; ingest.sh, the profile beside it in the image).
    # INGEST_MACHINE / INGEST_SPOT describe this job def (vcpu/memory_mib above, the FARGATE_SPOT queue,
    # ARM64): the profile prices that machine.
    SCAN_RUNS_PROFILE: /app/infra/aws/scan-runs.json
    INGEST_MACHINE: fargate-arm64-2vcpu-16gib
    INGEST_SPOT: "1"
    # The static name index's generation: the site's STATIC_GEN (site/wrangler.toml); ingest.sh builds
    # it on its first run, then appends each laptop scan.
    STATIC_GEN: "2026-10-15"
    # The meta store's (site/wrangler.toml STORES_JSON meta STATIC_GEN): each capture also scans the bucket as `meta`.
    META_STATIC_GEN: "2026-10-18meta"
  # Created empty; values set out of band by `aws/put-secrets` (never in state).
  disk-tree-m3:secrets:
    AWS_ACCESS_KEY_ID: disk-tree-m3/r2-access-key-id
    AWS_SECRET_ACCESS_KEY: disk-tree-m3/r2-secret-access-key
    CLOUDFLARE_API_TOKEN: disk-tree-m3/cf-d1-token
    # The scan-run wrapper's alerts (`disk-tree notify`'s Pushover channel).
    PUSHOVER_TOKEN: disk-tree-m3/pushover-token
    PUSHOVER_USER: disk-tree-m3/pushover-user
encryptionsalt: v1:QvVtYICwoEI=:v1:siNh6SqB8PdKdjVa:KJ40inG3RlfZPPjQqOdNm2PLHq01Yw==
