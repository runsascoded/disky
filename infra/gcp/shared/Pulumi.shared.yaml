# The VM pilot's box (specs/vm-pilot.md "The box", Ryan's go 2026-11-27): one e2-standard-4 + a 50 GB pd-balanced data
# disk in oa-internal-450019, in r2's Batch region; tenants `oa-r2` (r2.oa.dev; its `deployment` label) and `hf`.
# Per-deployment isolation: the box holds nothing of a tenant's but the right to mint its job account's tokens.
config:
  gcp:project: oa-internal-450019
  gcp:region: us-west1
  disky-shared-gcp:labels: app=disky,deployment=shared
  disky-shared-gcp:vmPilot:
    accountId: disky-vm-pilot
    zone: us-west1-b
    machineType: e2-standard-4
    cidr: 10.64.0.0/24
    bootDiskGb: 20
    dataDiskGb: 50
    # The slices' budgets (deploy/vm-pilot/*.slice hold placeholders; bootstrap.sh writes these as drop-ins): 16 GB =
    # serve's floor + scan's cap + the OS's ~2 GB, page cache between.
    serveMemoryMin: 3G
    scanMemoryMax: 8G
    # The checkout the box runs (the slices and units, `vmd` + `fsb` built from bench/full-scan, `dt-cloud` for the
    # local job backend and the pack sync). Pin it to the landed `cloud` sha before `up`:
    # `pulumi config set --path vmPilot.ref <sha>`.
    repo: https://github.com/Open-Athena/disky.git
    ref: 9103c72e43d46ffd9bfe761e47188b4f338f2641
    tunnelSecret: vm-pilot-tunnel-token
    # The tenants' image hosts: pulled with the job's own token (deploy/vm-pilot/docker-credential-disky)
    registries: [us-west1-docker.pkg.dev, us-central1-docker.pkg.dev]
    tenants:
      - name: oa-r2
        # o/r2 `job/r2.json` `job_account`: holds r2's scan secrets, its data bucket and its images
        jobAccount: oa-r2-usage-job@oa-internal-450019.iam.gserviceaccount.com
        vmdKeySecret: vm-pilot-vmd-key-oa-r2
        # `dt-cloud vm-pack pull`: the store `vm-pack build` publishes to, beside the interval store the site reads; its
        # credentials read as the job account
        pack:
          store: r2://oa-r2-usage-index
          env:
            DISKY_R2_ENDPOINT_URL: https://74981a43be0de7712369306c7b19133d.r2.cloudflarestorage.com
            AWS_DEFAULT_REGION: auto
          secrets:
            AWS_ACCESS_KEY_ID: oa-r2-index-access-key-id
            AWS_SECRET_ACCESS_KEY: oa-r2-index-secret-access-key
      - name: hf
        # o/hf `job/profiles/hf.yml` `executor.service_account`
        jobAccount: hf-usage-job@oa-internal-450019.iam.gserviceaccount.com
        vmdKeySecret: vm-pilot-vmd-key-hf
        pack:
          store: r2://oa-hf-usage-index
          env:
            AWS_DEFAULT_REGION: auto
          secrets:
            DISKY_R2_ENDPOINT_URL: hf-usage-r2-endpoint
            AWS_ACCESS_KEY_ID: hf-usage-r2-access-key-id
            AWS_SECRET_ACCESS_KEY: hf-usage-r2-secret-access-key
