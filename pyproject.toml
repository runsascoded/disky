[project]
name = "disk-tree"
version = "0.1.0"
description = "Disk/Cloud space usage analyzer"
readme = "README.md"
authors = [{name = "Ryan Williams", email = "ryan@runsascoded.com"}]
license = {text = "Apache License 2.0"}
requires-python = ">=3.11"

dependencies = [
    "click",
    "duckdb",
    "flask",
    "flask-cors",
    "flask-sqlalchemy",
    "humanize",
    "kaleido",
    "pandas",
    "plotly",
    "pyarrow",
    "python-dateutil",
    "pyyaml>=6.0.3",
    "sqlalchemy",
    "tqdm",
    "utz",
]

[project.optional-dependencies]
# Native macOS window (pywebview → pyobjc WebKit/Cocoa) + a real WSGI server
# (Flask's dev server doesn't bind under PyInstaller). See specs/macos-app.md.
app = [
    "pywebview",
    "waitress",
]
dev = [
    "mypy",
    "pytest",
]
mem = [
    "memray",
]
# Post monthly digests to Slack/Discord (`disk-tree digest`). Core stays lean —
# only a deployment that posts pulls `thrds`; `discord_api` needs only stdlib.
# The OP plot uses plotly + kaleido, already core deps.
notify = [
    "thrds",
]
# Sharded bulk listers for cloud object stores. Split by scheme so users pay
# only for the SDK they use; `bulk` pulls all three for convenience.
gcs = [
    "fsspec",
    "gcsfs",
    "google-cloud-storage",
]
s3 = [
    "boto3",
    "fsspec",
    "s3fs>=2024.10",
]
r2 = [
    "boto3",
    "fsspec",
    "s3fs>=2024.10",
]
bulk = [
    "boto3",
    "fsspec",
    "gcsfs",
    "google-cloud-storage",
    "s3fs>=2024.10",
]

[project.scripts]
disk-tree = "disk_tree.cli.main:cli"
disk-tree-server = "disk_tree.server:main"
disk-tree-app = "disk_tree.desktop:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv.workspace]
# `cloud/` (dt-cloud, the cloud overlay) is a workspace member: ONE lockfile
# for the engine and the overlay, one environment, so the job images, CI and
# the laptop all resolve the same pins (before this, `cloud/uv.lock` and
# `uv.lock` disagreed on 34 packages and each `uv sync` repointed the shared
# venv to whichever ran last; the job image ignored both and resolved fresh).
members = ["cloud"]

[tool.uv.sources]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["disk_tree"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    ".claude/",
    ".idea/",
    ".venv/",
    "screenshots/",
    "tmp/",
    "ui/node_modules/",
    "*.iml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/disk_tree"]

# Include built UI assets in the wheel (if they exist)
# Run `cd ui && pnpm build` before building the wheel
[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "disk_tree/static"
