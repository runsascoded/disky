# Cloudflare Pages: the disk-tree SPA (`dist/`) + the read subset of its
# `/api/*` contract as Pages Functions (`functions/api/`) over an R2 bucket
# holding reduced scans (`<uuid>.parquet` + `<uuid>.parquet.scan.json`, as
# `disk-tree reduce --to r2://…` / `index --to r2://…` leave them). Spec
# `specs/done/cloud-reduce.md` step 4.
#
# Local: `pnpm build && pnpm cfn:dev` serves dist + functions on :7789 with an
# emulated R2 — seed it with `wrangler r2 object put --local` (see the spec).
name = "disk-tree"
# Account: Pages configs can't carry `account_id`, and `wrangler login` state
# is machine-global (other projects log in as other accounts), so the account
# is pinned by `CLOUDFLARE_ACCOUNT_ID` + `CLOUDFLARE_API_TOKEN` in the repo's
# `.envrc` — deploy via `direnv exec .. pnpm exec wrangler pages deploy`.
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

[[r2_buckets]]
binding = "SCANS"
bucket_name = "disk-tree"

[vars]
SCANS_PREFIX = "scans/"
# Max objects the edge R2 CFN deletes inline before deferring to the drainer
# (spec `specs/staged-delete.md` CP7).
DELETE_THRESHOLD = "1000"

# R2 CFN executor (CP7): bind each demo R2 bucket the edge may delete from as
# `R2_<bucket>` (bucket name sanitized to an identifier). A staged `r2://ctbk/…`
# then deletes inline via `env.R2_ctbk` instead of enqueueing for the drainer;
# unbound buckets fall back to the drainer automatically. Uncomment + add yours,
# then redeploy. Example:
# [[r2_buckets]]
# binding = "R2_ctbk"
# bucket_name = "ctbk"

# The gate (spec `specs/pages-auth.md`): grants + access log. Created with
# `wrangler d1 create disk-tree-auth` (fill `database_id` from its output),
# schema via `wrangler d1 migrations apply disk-tree-auth` (`--local` for
# `cfn:dev`, which uses a local SQLite file and needs no id).
#
# Identity-bearing config is Pages secrets (`wrangler pages secret put`), not
# vars in this public file: SESSION_SECRET, ALLOWED_EMAILS, ACCESS_TEAM_DOMAIN,
# ACCESS_AUD.
[[d1_databases]]
binding = "DB"
database_name = "disk-tree-auth"
database_id = "c17a63c1-1d6f-443c-9d35-f1e9c5e674ac"
migrations_dir = "migrations"
