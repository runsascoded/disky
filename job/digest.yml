# cw-s3's Slack usage digest (`dt-cloud digest -T cw -C job/digest.yml`): every
# `DigestConfig` field, spelled out, so this file alone is the deployment's
# digest policy (the `cw` preset on `cloud` can then go). Validated on load:
# unknown keys raise. Secrets stay env-only (`SLACK_BOT_TOKEN`, `SLACK_CHANNEL`).
template: cw
title: CoreWeave usage
units: TiB                 # binary sizes (the default; `TB` for a store billed in decimal TB)
site_url: https://cw.oa.dev
# `{DATA_BUCKET}` reads the env; the job passes `-r` anyway
root: gs://{DATA_BUCKET}/snapshots/cw
# keyed by channel (a staging converge never masquerades as prod) and variant
state: digest/cw/{channel}/{variant}
preview: r2://oa-cw-s3-usage-index/digest/preview/{channel}/{variant}  # each converge's OP bundle, for the site's /admin/slack
discord_state: digest/discord/{webhook}
discord_webhook_env: null
icons_base: https://oa-cw-s3-usage-icons.pages.dev
# the month OP's (and the day line's) sender icon: the store's mark (`deploy/slack/icons/cw.png`, 256 px), served from
# `job/icons/` on the icons project's production alias
op_icon: mark.png
icons_dir: job/icons-cw
# plots go to the icons project's `cw` preview branch, never the production
# alias that serves CW's arrow avatars
plot_project: oa-cw-s3-usage-icons
plot_branch: cw
plot_base: https://cw.oa-cw-s3-usage-icons.pages.dev
# sender: the headline as the reply's sender name + a trend-arrow avatar, one
# reply per UTC day from its first scan at/after `reply_hour` (12:01Z = 8:01 am ET)
variant: sender
reply_hour: 12
# before the day's reply scan lands, its earlier scans post one provisional reply
# (`10/3 · so far`, numbers in the body, edited in place), deleted when the
# final reply posts
provisional: true
# a quota at/over this percent: :red_circle: in the daily replies + one alert reply also sent to the channel (thrds
# `post(broadcast=True)`), deleted once every quota is back under
alert_pct: 90
# the daily replies' quota clauses in config order, each circled by runway: free ÷ the fastest net fill over the last
# 1/3/7 days (:red_circle: under 3 days or over quota, :large_orange_circle: under 14 or ≥ 95% full, :large_yellow_circle:
# under 30), with `, +N Ti/d, ≈Nd to full` under 60 days (specs/digest-runway-marks.md; `circles`: by fill, fullest first)
quota_marks: runway
# who renders the OP's text + plot request: `local` (the job's Python) or `site` (`POST /api/digest-op`, the renderer
# /admin/slack previews with) under `params` (its codec string, e.g. `qc,pp`; "" = the defaults = local's bytes)
# site (2026-11-02): byte-identical to local under "" (checked on the live November OP); `qr,pp` = the quota line
# (every pool, config order, circled by runway as the replies) under the headline + the plot as % of each pool's quota
renderer: site
params: qr,pp
primary: marin-us-east-02a
# quotas from CoreWeave's `cwobject_quota_info` metric, which is per ZONE: 02a =
# exactly 910 TiB ("1 PB"); US-EAST-08A = 500 TiB (100 until 2026-10-16) shared by
# hero-checkpoints, rhoarnet-us-east-08a and marin-us-east-08a (`zone: 08a`, one
# tail clause against the zone's quota); US-EAST-06A and US-WEST-04A = 100 TiB
# each, one bucket apiece (finelog, 2026-10-17); RNO2A = 100 TiB shared by
# marinfold-exp368-rno2a and marin-rno2a (Grafana's CoreWeaveStorageQuotaExceeded,
# 2026-10-29: writes suspended, while the digest showed rno2a with no quota clause)
buckets:
  marin-us-east-02a: {label: 02a, quota: {bytes: 910 TiB, name: 1 PB, short: 1P}}
  hero-checkpoints: {label: hero, zone: 08a, quota: {bytes: 500 TiB, name: 500 TiB, short: 500Ti}}
  marin-us-east-06a: {label: 06a, quota: {bytes: 100 TiB, name: 100 TiB, short: 100Ti}}
  rhoarnet-us-east-08a: {label: rhoarnet, zone: 08a, quota: {bytes: 500 TiB, name: 500 TiB, short: 500Ti}}
  marin-us-east-08a: {label: 08a, zone: 08a, quota: {bytes: 500 TiB, name: 500 TiB, short: 500Ti}}
  marin-us-west-04a: {label: 04a, quota: {bytes: 100 TiB, name: 100 TiB, short: 100Ti}}
  marinfold-exp368-rno2a: {label: marinfold, zone: rno2a, quota: {bytes: 100 TiB, name: 100 TiB, short: 100Ti}}
  marin-rno2a: {label: rno2a, zone: rno2a, quota: {bytes: 100 TiB, name: 100 TiB, short: 100Ti}}
prices: {}
