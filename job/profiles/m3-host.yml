# A capture host's own store on disk.rbw.sh (the NAS, an enrolled Mac: D1 `hosts`, `dt-cloud hosts resolve`), the
# laptop profile's shape (`m3.yml`) with the store `@STORE@` filled by `infra/aws/scan.sh`: its own `snapshots/@STORE@/`,
# `listing/@STORE@/` and D1 rows. A secondary store is served per scan, so no interval store, and no static name index.
deployment: m3
store: "@STORE@"
executor: {kind: local}
work: /work/nf
data: /work/data
layout:
  layer2: listing/@STORE@/{scan}/
  snapshots: "@STORE@"
  listing: capture/{scan}/
sources:
  - uri: r2://disk-tree
    listing: "{env:DT_CAPTURE}"
machines:
  small: {cpus: 1, memory: 2GB}
  medium: {cpus: 2, memory: 8GB}
  big: {cpus: 2, memory: 14GB}
  list: {cpus: 1, memory: 2GB}
  post: {cpus: 1, memory: 2GB}
skip: [bucket-check, interval-store, static-names, over-time, warm-cache, probe, digest]
fold: []
env:
  SCAN_RUNS_PROFILE: /app/infra/aws/scan-runs.json
  D1_DB_ID: e5288564-a010-4177-9f3c-77e25fad9f72   # disk-tree-m3-db (site/wrangler.toml)
  D1_DB_NAME: disk-tree-m3-db
  R2_BUCKET: disk-tree
  AWS_DEFAULT_REGION: auto
labels: {deployment: m3}
options:
  index:
    mode: path-index
    args: [-g]
    age_pyramids: true
    annotate: [disk-tree, capture-meta, -c, "r2://disk-tree/snapshots/@STORE@/{scan}/meta.json", "{listing}/_SUCCESS.json", "{snap}/meta.json"]
  index-sync:
    variants: [path, bysize, age-pyramid-1h, age-pyramid-3h, age-pyramid-6h, age-pyramid-12h, age-pyramid-1d,
               age-pyramid-2d, age-pyramid-4d, age-pyramid-8d]
  index-gc: {dry: true}
