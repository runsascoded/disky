# The cw scan on the generic pipeline (specs/pipelines-everywhere.md §6.2): `dt-cloud scan head job/profiles/cw.yml`
# runs `job/nf/scan.nf`, each step `dt-cloud scan step <name>` in its own Batch task. Replaces `job/nf/cw.nf` +
# `cw-head.sh` + `cw-step.sh` (and `cw-env.sh`'s config, which is this file's `env`).
deployment: cw
executor:
  kind: google-batch
  project: oa-internal-450019
  # beside the data bucket (`oa-cw-s3-usage-data`, us-east1): every step reads and writes it, and from us-central1 those
  # reads and writes were billed as inter-region transfer. The head (the cron's Batch job, infra/gcp) stays in us-central1:
  # it only orchestrates
  region: us-east1
  service_account: cw-s3-job@oa-internal-450019.iam.gserviceaccount.com
  image: us-central1-docker.pkg.dev/oa-internal-450019/cw-s3-usage/scan:latest
  boot_disk: 50
work: gs://oa-cw-s3-usage-data/nf
data: gs://oa-cw-s3-usage-data
layout:
  layer2: cw-l2/{scan}/
  snapshots: cw
# The primary first. The 02a listing is CPU-bound (22.8 min on 16 vCPUs, 33–42 on 8) and stages its shards + import on
# a local SSD; the small buckets fit an e2 (which takes no local SSD) and its boot disk. Still queued 10 min after submit (a
# GCE stockout: 02a waited 26 min for an n2-standard-16, 2026-10-27), a task moves to the next type, an N2D (its own pool).
sources:
  - {uri: s3://marin-us-east-02a, endpoint: https://cwobject.com, machine: n2-standard-16, disk: {request: 375, type: local-ssd},
     fallback: [n2d-standard-16], queue_timeout: 10}
  - {uri: s3://hero-checkpoints, endpoint: https://cwobject.com}
  - {uri: s3://marin-us-east-06a, endpoint: https://cwobject.com}
  - {uri: s3://rhoarnet-us-east-08a, endpoint: https://cwobject.com}
  - {uri: s3://marin-us-east-08a, endpoint: https://cwobject.com}
  - {uri: s3://marin-us-west-04a, endpoint: https://cwobject.com}
  - {uri: s3://marinfold-exp368-rno2a, endpoint: https://cwobject.com}
  - {uri: s3://marin-rno2a, endpoint: https://cwobject.com}
machines:
  small: e2-standard-2
  medium: e2-standard-4
  # index-write (DuckDB, 16 GB) and the interval store's append (16 GiB RSS, ~25 GiB disk at a compaction), staged on a
  # local SSD (an untyped disk only grows the pd boot disk: the 02a import took 8.1 min there vs 5.5–6.8 on NVMe)
  big: {type: n2-standard-8, disk: {request: 375, type: local-ssd}, fallback: [n2d-standard-8], queue_timeout: 10}
  list: {type: e2-standard-4, disk: 100}
  # over-time caps DuckDB at 16 GB, all of an e2-standard-4
  post: e2-highmem-4
  # over-time's own task: seconds on most scans, but every 16th seals a group of 16 (87 min on 8 vCPUs, 2026-10-13);
  # beside `post`, so the digest and warm-up never wait on it. Its DuckDB spill outgrew the boot disk (36 GiB full,
  # group 13, 2026-10-27), so it stages on a local SSD like `big`
  over_time: {type: n2-standard-8, disk: {request: 375, type: local-ssd}, fallback: [n2d-standard-8], queue_timeout: 10}
secrets:
  AWS_ACCESS_KEY_ID: cw-s3-access-key-id
  AWS_SECRET_ACCESS_KEY: cw-s3-secret-access-key
  SLACK_BOT_TOKEN: cw-s3-slack-bot-token
  CLOUDFLARE_API_TOKEN: cw-s3-cf-pages-token
  SITE_TOKEN: cw-s3-job-grant
  R2_ENDPOINT: cw-s3-r2-endpoint
  R2_ACCESS_KEY_ID: cw-s3-isolated-r2-access-key-id
  R2_SECRET_ACCESS_KEY: cw-s3-isolated-r2-secret-access-key
  # Account Analytics: Read, for the `cf-usage` step (`snapshots/usage/<date>.json`)
  CF_ANALYTICS_TOKEN: cw-s3-cf-analytics-token
env:
  SCAN_RUNS_PROFILE: /app/job/scan-runs.json
  D1_DB_ID: 7f1e1326-b879-4ecd-8621-846621c24f36   # oa-cw-s3-usage-db (site/wrangler.toml)
  D1_DB_NAME: oa-cw-s3-usage-db
  INDEX_VARIANTS: path                              # no user-sorted tiers here
  SITE_URL: https://cw.oa.dev
  WARM_PATHS: ",marin-us-east-02a,marin-us-east-02a/marin,marin-us-east-02a/tmp,marin-us-east-02a/iris,hero-checkpoints,hero-checkpoints/tmp,hero-checkpoints/marin,marin-us-east-06a,marin-us-east-06a/marin,rhoarnet-us-east-08a,marin-us-east-08a,marin-us-west-04a,marinfold-exp368-rno2a,marin-rno2a"
  SWEEP_BUCKET: marin-us-east-02a
  SWEEP_S3_ENDPOINT: https://cwobject.com
  # the R2 serving bucket each scan's served subset is published to (`cw-s3` CF stack's `r2_bucket`)
  R2_BUCKET: oa-cw-s3-usage-index
  SLACK_CHANNEL: C0C1YR7D0KU          # #cw-s3-usage: the digest
  SLACK_ALERT_CHANNEL: C0C53CPM886    # #cw-s3-admin: pipeline alerts beside the staging threads (#<deploy>-usage carries only the digest)
  CLOUDFLARE_ACCOUNT_ID: 74981a43be0de7712369306c7b19133d   # the digest plot's `wrangler pages deploy`
  # boto needs a region though CAIOS ignores it; CAIOS rejects path-style requests, which boto's auto picks for a custom
  # endpoint
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"
  DT_S3_ADDRESSING_STYLE: virtual
  STATIC_NAMES_IMAGE: us-central1-docker.pkg.dev/oa-internal-450019/cw-s3-usage/scan:latest
  # cost labels (specs/done/cost-labels-required.md): `scan head` refuses without them; every Batch job it and its
  # steps submit inherits them
  DISKY_LABELS: app=disky,deployment=cw
  BATCH_REGION: us-east1
pass: [DT_RECORD, DT_ALERTS]
# after each scan, the per-scan files the interval store + static index hold (specs/lean-scans.md §2), retired for real
# since the reviewed one-off by hand (2026-10-18: 167 scans, ~874 GB over GCS + R2)
# `gcp-cost`: the day's GCP cost snapshot (`/admin/cost/gcp`), `cf-usage` the Cloudflare one (`/admin/usage`), `soft-delete`
# what each bucket retains (`/admin`); all never fatal
steps: [retire, gcp-cost, cf-usage, soft-delete]
labels: {deployment: cw}
queue_size: 20
options:
  list:
    import: true
    bulk_args: [-a]
    threads: 8
    # `-M {mem}`: each source machine's own DuckDB budget (import's default 8GB failed the 02a import's object-version
    # attach on its n2-standard-16, 2026-10-24T0601)
    import_args: [-e, stream, -j, "{nproc}", -M, "{mem}", -m, -p, storage_class_id]
  index:
    webdata: [python, /app/job/cw-webdata.py, "{web}", "{sources}", -l, Marin CoreWeave, -a, "{date}"]
    lifecycle: true
    mem: 16GB
  # The scan submits its due carries (not waited on); a due compaction (hours: 10-29's level 5 ran past 2 h) is deferred to
  # `compact_cmd`, its own coordinator job, never inside a scan's 6 h task. (`merge: false`, 10-24 → 10-29, left the carries
  # to nothing: 35 level-0 runs, and search refused every scan.)
  static-names: {profile: /app/job/static-names.json, compact_cmd: [env, MERGE=1, bash, /app/job/cw-static-submit.sh]}
  publish-r2: {barrier: true}
  interval-store: {timeout: 90m, mem: 12GB}
  over-time: {mem: 16GB}
  digest: {template: cw, config: /app/job/digest.yml}
  # cw's own GCS buckets (the CoreWeave buckets and R2 bill elsewhere); compute: every Batch job `$DISKY_LABELS` selects
  gcp-cost: {buckets: [oa-cw-s3-usage-data, oa-cw-s3-usage-scratch]}
  # the Nextflow task's cwd isn't the image's `/app`
  cf-usage: {config: /app/site/wrangler.toml}
  # the data bucket, then the R2 copy: every scan but the newest 2, each verified against the interval store in this task
  # first (about one per run once caught up; a failed or unverifiable scan keeps its files)
  retire: {keep: 2, execute: true, verify_jobs: 3, static_gen: 2026-10-15cw.c001, layer2: true, copies: [r2]}
